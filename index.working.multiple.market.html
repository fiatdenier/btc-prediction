<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Prediction Markets</title>
    <style>
        :root {
            --btc-orange: #f7931a;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --yes-green: #22c55e;
            --no-red: #ef4444;
            --border-color: #2a2a2a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--dark-bg);
            color: white;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            padding: 20px 0 40px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--btc-orange);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 1.1rem;
        }

        .markets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .market-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .market-card:hover {
            border-color: var(--btc-orange);
            transform: translateY(-2px);
        }

        .market-question {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
            min-height: 60px;
        }

        .market-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            color: #888;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .yes-value { color: var(--yes-green); }
        .no-value { color: var(--no-red); }

        .market-pool {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .market-pool strong {
            color: var(--btc-orange);
        }

        .market-deadline {
            color: #666;
            font-size: 0.85rem;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .status-open { background: rgba(34, 197, 94, 0.2); color: var(--yes-green); }
        .status-closed { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .status-resolved { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ccc;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #888;
            font-size: 1.1rem;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--btc-orange);
            border-radius: 12px;
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: #888;
            background: none;
            border: none;
        }

        .close-modal:hover { color: white; }

        .action-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-yes {
            background: var(--yes-green);
            color: white;
        }

        .btn-yes:hover { background: #16a34a; }

        .btn-no {
            background: var(--no-red);
            color: white;
        }

        .btn-no:hover { background: #dc2626; }

        input {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        input:focus {
            outline: none;
            border-color: var(--btc-orange);
        }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .quick-amt-btn {
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .quick-amt-btn:hover {
            background: #3a3a3a;
            border-color: var(--btc-orange);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Bitcoin Prediction Markets</h1>
            <div class="subtitle">Place your bets. Win sats. Powered by Lightning ⚡</div>
        </header>

        <h2 class="section-title">🔥 Active Markets</h2>
        <div id="active-markets" class="markets-grid">
            <div class="loading">Loading markets...</div>
        </div>

        <div id="resolved-section" style="display: none; margin-top: 60px;">
            <h2 class="section-title">📊 Recently Resolved</h2>
            <div id="resolved-markets" class="markets-grid"></div>
        </div>
    </div>

    <!-- Bet Modal -->
    <div id="bet-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeBetModal()">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <script>
        const API_BASE = 'https://predict.fiatdenier.com';
        let currentMarket = null;

        async function loadMarkets() {
            try {
                const response = await fetch(`${API_BASE}/markets`);
                const data = await response.json();

                // Display active markets
                displayMarkets(data.active, 'active-markets');

                // Display resolved markets
                if (data.resolved && data.resolved.length > 0) {
                    document.getElementById('resolved-section').style.display = 'block';
                    displayMarkets(data.resolved, 'resolved-markets');
                }
            } catch (error) {
                console.error('Failed to load markets:', error);
                document.getElementById('active-markets').innerHTML = 
                    '<div class="loading">Failed to load markets</div>';
            }
        }

        function displayMarkets(markets, containerId) {
            const container = document.getElementById(containerId);

            if (!markets || markets.length === 0) {
                container.innerHTML = '<div class="loading">No markets available</div>';
                return;
            }

            container.innerHTML = markets.map(market => `
                <div class="market-card" onclick="openMarket('${market.id}')">
                    <div class="status-badge status-${market.status}">${market.status}</div>
                    <div class="market-question">${market.question}</div>
                    
                    <div class="market-stats">
                        <div class="stat">
                            <div class="stat-label">YES</div>
                            <div class="stat-value yes-value">${market.yes_percentage}%</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">NO</div>
                            <div class="stat-value no-value">${market.no_percentage}%</div>
                        </div>
                    </div>

                    <div class="market-pool">
                        Total Pool: <strong>${market.total_pool.toLocaleString()} sats</strong>
                    </div>

                    <div class="market-deadline">
                        Deadline: ${new Date(market.deadline).toLocaleDateString()}
                    </div>
                </div>
            `).join('');
        }

        async function openMarket(marketId) {
            try {
                const response = await fetch(`${API_BASE}/market/${marketId}`);
                currentMarket = await response.json();
                currentMarket.id = marketId;

                const modal = document.getElementById('bet-modal');
                const content = document.getElementById('modal-content');

                if (currentMarket.status !== 'open') {
                    content.innerHTML = `
                        <h2>${currentMarket.question}</h2>
                        <div style="text-align: center; padding: 40px; color: #888;">
                            <p>This market is ${currentMarket.status}.</p>
                            ${currentMarket.outcome ? `<p style="margin-top: 20px; font-size: 1.5rem;">Outcome: <strong style="color: var(--btc-orange);">${currentMarket.outcome}</strong></p>` : ''}
                        </div>
                    `;
                } else {
                    content.innerHTML = `
                        <h2 style="margin-bottom: 20px;">${currentMarket.question}</h2>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px;">
                            <div style="text-align: center; padding: 15px; background: rgba(34, 197, 94, 0.1); border-radius: 8px;">
                                <div style="color: var(--yes-green); font-size: 2rem; font-weight: bold;">${currentMarket.yes_percentage}%</div>
                                <div style="color: #888;">YES</div>
                                <div style="color: var(--yes-green); margin-top: 5px;">${currentMarket.yes_total} sats</div>
                            </div>
                            <div style="text-align: center; padding: 15px; background: rgba(239, 68, 68, 0.1); border-radius: 8px;">
                                <div style="color: var(--no-red); font-size: 2rem; font-weight: bold;">${currentMarket.no_percentage}%</div>
                                <div style="color: #888;">NO</div>
                                <div style="color: var(--no-red); margin-top: 5px;">${currentMarket.no_total} sats</div>
                            </div>
                        </div>

                        <label style="display: block; color: #888; margin-bottom: 10px;">Amount (sats)</label>
                        <input type="number" id="bet-amount" placeholder="100" min="10" value="100">

                        <div class="quick-amounts">
                            <button class="quick-amt-btn" onclick="setBetAmount(100)">100</button>
                            <button class="quick-amt-btn" onclick="setBetAmount(500)">500</button>
                            <button class="quick-amt-btn" onclick="setBetAmount(1000)">1K</button>
                            <button class="quick-amt-btn" onclick="setBetAmount(5000)">5K</button>
                        </div>

                        <div style="background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
                            <div style="color: #888; font-size: 0.85rem; margin-bottom: 5px;">Estimated Payout If Win</div>
                            <div id="estimated-payout" style="font-size: 1.5rem; font-weight: bold; color: var(--btc-orange);">~0 sats</div>
                        </div>

                        <button class="action-btn btn-yes" onclick="placeBet('YES')">BUY YES</button>
                        <button class="action-btn btn-no" onclick="placeBet('NO')">BUY NO</button>
                    `;

                    // Update estimate on amount change
                    document.getElementById('bet-amount').addEventListener('input', updateEstimate);
                    updateEstimate();
                }

                modal.style.display = 'block';
            } catch (error) {
                console.error('Failed to load market:', error);
                alert('Failed to load market details');
            }
        }

        function setBetAmount(amount) {
            document.getElementById('bet-amount').value = amount;
            updateEstimate();
        }

        function updateEstimate() {
            const amount = parseInt(document.getElementById('bet-amount').value) || 0;
            if (amount === 0) {
                document.getElementById('estimated-payout').textContent = '~0 sats';
                return;
            }

            // Simple estimate assuming user bets YES
            const currentYes = currentMarket.yes_total;
            const currentNo = currentMarket.no_total;
            const houseRake = currentMarket.house_rake / 100;

            const newYesTotal = currentYes + amount;
            const share = amount / newYesTotal;
            const profit = share * currentNo * (1 - houseRake);
            const estimated = amount + profit;

            document.getElementById('estimated-payout').textContent = 
                '~' + Math.round(estimated).toLocaleString() + ' sats';
        }

        async function placeBet(side) {
            const amount = parseInt(document.getElementById('bet-amount').value);

            if (!amount || amount < 10) {
                alert('Minimum bet is 10 sats');
                return;
            }

            // Show loading
            document.getElementById('modal-content').innerHTML = '<div class="loading">Creating position...</div>';

            try {
                const response = await fetch(`${API_BASE}/market/${currentMarket.id}/create-position`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        side: side,
                        amount: amount
                    })
                });

                const data = await response.json();

                if (data.error) {
                    alert(data.error);
                    closeBetModal();
                    return;
                }

                // Show invoice
                showInvoice(data);

            } catch (error) {
                console.error('Bet failed:', error);
                alert('Failed to create bet');
                closeBetModal();
            }
        }

        function showInvoice(data) {
            const content = document.getElementById('modal-content');

            content.innerHTML = `
                <h3 style="text-align: center; margin-bottom: 20px;">Pay Invoice</h3>

                <div id="qr-code" style="text-align: center; margin: 20px 0;"></div>

                <div style="background: #0a0a0a; padding: 15px; border-radius: 8px; word-break: break-all; font-size: 0.85rem; font-family: monospace; margin-bottom: 20px;">
                    ${data.invoice}
                </div>

                <button class="action-btn" style="background: var(--btc-orange);" onclick="copyToClipboard('${data.invoice}')">
                    📋 COPY INVOICE
                </button>

                <div style="text-align: center; margin-top: 20px; color: #888; font-size: 0.9rem;">
                    Checking for payment...
                </div>
            `;

            // Generate QR code
            new QRCode(document.getElementById('qr-code'), {
                text: data.invoice,
                width: 250,
                height: 250,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            // Start checking for payment
            checkPayment(data.market_id, data.ticket_number);
        }

        function checkPayment(marketId, ticketNumber) {
            const checkInterval = setInterval(async () => {
                try {
                    const response = await fetch(
                        `${API_BASE}/market/${marketId}/confirm-position/${ticketNumber}`,
                        { method: 'POST' }
                    );
                    const data = await response.json();

                    if (data.status === 'confirmed' || data.status === 'already_confirmed') {
                        clearInterval(checkInterval);

                        document.getElementById('modal-content').innerHTML = `
                            <div style="text-align: center; padding: 40px;">
                                <div style="font-size: 4rem; margin-bottom: 20px;">✅</div>
                                <h2 style="color: var(--yes-green); margin-bottom: 10px;">Payment Confirmed!</h2>
                                <p style="color: #888;">Your ticket: <strong style="color: var(--btc-orange);">${ticketNumber}</strong></p>
                                <p style="color: #888; margin-top: 10px; font-size: 0.9rem;">Save this ticket number to claim winnings!</p>
                            </div>
                        `;

                        setTimeout(() => {
                            closeBetModal();
                            loadMarkets();
                        }, 3000);
                    }
                } catch (error) {
                    console.error('Payment check failed:', error);
                }
            }, 2000);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert('Copied to clipboard!');
        }

        function closeBetModal() {
            document.getElementById('bet-modal').style.display = 'none';
        }

        // Load markets on page load
        loadMarkets();

        // Refresh every 30 seconds
        setInterval(loadMarkets, 30000);
    </script>
</body>
</html>
