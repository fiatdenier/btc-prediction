<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satoshi's Market - Bitcoin Prediction Markets</title>
    <meta property="og:title" content="Satoshi's Market ⚡">
    <meta property="og:description" content="Sudden death Bitcoin prediction market. Winners take 95% of the pool.">
    <meta property="og:image" content="https://fiatdenier.com/satoshi.png">
    <meta property="og:url" content="https://fiatdenier.com/btc-prediction/">
    <meta property="og:type" content="website">
    <style>
        :root {
            --btc-orange: #f7931a;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --yes-green: #22c55e;
            --no-red: #ef4444;
            --border-color: #2a2a2a;
            --resolved-green: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--dark-bg);
            color: white;
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            padding: 20px 0 40px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            color: var(--btc-orange);
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .subtitle { 
            color: #888; 
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .markets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .market-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .market-card:hover {
            border-color: var(--btc-orange);
            transform: translateY(-2px);
        }

        .market-card.resolved {
            border-color: var(--resolved-green);
            background: linear-gradient(135deg, #1a1a1a 0%, #1a2a1a 100%);
        }

        .market-card.resolved:hover {
            border-color: var(--resolved-green);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }

        .market-question {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
            min-height: 60px;
        }

        .market-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .stat { text-align: center; }

        .stat-label {
            color: #888;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .stat-value { font-size: 1.5rem; font-weight: bold; }
        .yes-value { color: var(--yes-green); }
        .no-value { color: var(--no-red); }

        .market-pool {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .market-pool strong { color: var(--btc-orange); }

        .countdown {
            background: rgba(247, 147, 26, 0.1);
            border: 1px solid var(--btc-orange);
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            text-align: center;
        }

        .countdown-label {
            color: #888;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .countdown-time {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--btc-orange);
        }

        .countdown-units {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-top: 5px;
        }

        .countdown-unit {
            text-align: center;
        }

        .countdown-unit .number {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--btc-orange);
            display: block;
        }

        .countdown-unit .label {
            font-size: 0.65rem;
            color: #888;
            text-transform: uppercase;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .status-open { background: rgba(34, 197, 94, 0.2); color: var(--yes-green); }
        .status-closed { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .status-resolved { 
            background: rgba(34, 197, 94, 0.3); 
            color: var(--resolved-green);
            border: 1px solid var(--resolved-green);
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ccc;
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .category-tab {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: #888;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }

        .category-tab:hover {
            border-color: var(--btc-orange);
            color: var(--btc-orange);
        }

        .category-tab.active {
            background: var(--btc-orange);
            border-color: var(--btc-orange);
            color: #000;
        }

        .category-tab.tab-stocks.active  { background: #3b82f6; border-color: #3b82f6; color: #fff; }
        .category-tab.tab-stocks:hover   { border-color: #3b82f6; color: #3b82f6; }
        .category-tab.tab-sports.active  { background: #a855f7; border-color: #a855f7; color: #fff; }
        .category-tab.tab-sports:hover   { border-color: #a855f7; color: #a855f7; }

        /* BTC Live Ticker */
        .btc-ticker {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            margin-bottom: 32px;
            font-family: 'Courier New', monospace;
        }

        .ticker-icon {
            font-size: 1.3rem;
        }

        .ticker-label {
            color: #888;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ticker-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--btc-orange);
            transition: color 0.4s ease;
            min-width: 120px;
        }

        .ticker-price.up   { color: var(--yes-green); }
        .ticker-price.down { color: var(--no-red); }

        .ticker-change {
            font-size: 0.9rem;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 6px;
        }

        .ticker-change.up   { background: rgba(34,197,94,0.15);  color: var(--yes-green); }
        .ticker-change.down { background: rgba(239,68,68,0.15);   color: var(--no-red); }

        .ticker-status {
            margin-left: auto;
            font-size: 0.72rem;
            color: #555;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ticker-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #555;
            flex-shrink: 0;
        }

        .ticker-dot.live { background: var(--yes-green); animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #888;
            font-size: 1.1rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--btc-orange);
            border-radius: 16px;
            width: 100%;
            max-width: 760px;
            margin: 40px auto;
            padding: 40px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: #888;
            background: none;
            border: none;
        }

        .close-modal:hover { color: white; }

        .action-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-yes { background: var(--yes-green); color: white; }
        .btn-yes:hover { background: #16a34a; }
        .btn-no { background: var(--no-red); color: white; }
        .btn-no:hover { background: #dc2626; }

        input {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        input:focus {
            outline: none;
            border-color: var(--btc-orange);
        }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .quick-amt-btn {
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .quick-amt-btn:hover {
            background: #3a3a3a;
            border-color: var(--btc-orange);
        }

        .claim-section {
            background: var(--card-bg);
            border: 2px solid var(--yes-green);
            border-radius: 12px;
            padding: 30px;
            margin-top: 40px;
        }

        .ticket-display {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 2px solid var(--btc-orange);
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
            text-align: center;
        }

        /* Direction indicator badge */
        .direction-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 8px;
            vertical-align: middle;
        }
        .direction-up   { background: rgba(34,197,94,0.18); color: var(--yes-green); border: 1px solid var(--yes-green); }
        .direction-down { background: rgba(239,68,68,0.18);  color: var(--no-red);   border: 1px solid var(--no-red); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>⚡ Satoshi's Market</h1>
                    <div class="subtitle">Predict the Future. Win Sats. Powered by Lightning Network ⚡</div>
                </div>
                <div style="text-align: right;">
                    <label style="color: #888; font-size: 0.9rem; cursor: pointer;">
                        <input type="checkbox" id="timezone-toggle" style="margin-right: 8px;">
                        Show times in EST (default: UTC)
                    </label>
                </div>
            </div>
        </header>

        <!-- BTC Live Price Ticker -->
        <div class="btc-ticker">
            <span class="ticker-icon">₿</span>
            <div>
                <div class="ticker-label">BTC / USD</div>
                <div class="ticker-price" id="ticker-price">Connecting...</div>
            </div>
            <div id="ticker-change" class="ticker-change" style="display:none;"></div>
            <div class="ticker-status">
                <div class="ticker-dot" id="ticker-dot"></div>
                <span id="ticker-status-text">Connecting to live feed...</span>
            </div>
        </div>

        <h2 class="section-title">🔥 Active Markets</h2>

        <div class="category-tabs">
            <button class="category-tab active"        data-cat="all"     onclick="setTab(this)">All</button>
            <button class="category-tab"               data-cat="bitcoin" onclick="setTab(this)">₿ Bitcoin</button>
            <button class="category-tab tab-stocks"    data-cat="stocks"  onclick="setTab(this)">📈 Stocks</button>
            <button class="category-tab tab-sports"    data-cat="sports"  onclick="setTab(this)">🏆 Sports</button>
        </div>

        <div id="active-markets" class="markets-grid">
            <div class="loading">Loading markets...</div>
        </div>

        <div id="resolved-section" style="display: none; margin-top: 60px;">
            <h2 class="section-title">✅ Recently Resolved</h2>
            <div id="resolved-markets" class="markets-grid"></div>
        </div>

        <!-- Claim Winnings Section -->
        <div id="claim-section" class="claim-section" style="display: none;">
            <h2 style="margin-top: 0;">💰 Claim Your Winnings</h2>
            
            <p style="color: #888; margin-bottom: 20px;">
                If you have a winning ticket, enter your details below to claim your payout.
            </p>

            <input type="text" id="claim-ticket-number" placeholder="Ticket Number (e.g., ABC123XY)">
            <input type="text" id="claim-signature" placeholder="Claim Key (your secret signature)" style="font-family: monospace;">
            <input type="text" id="claim-lightning-address" placeholder="Lightning Address (you@getalby.com) or Invoice">

            <button class="action-btn btn-yes" onclick="claimWinnings()">
                💸 CLAIM WINNINGS
            </button>

            <div id="claim-status" style="margin-top: 20px;"></div>
        </div>
    </div>

    <!-- Bet Modal -->
    <div id="bet-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <script>
        const API_BASE = 'https://predict.fiatdenier.com/api';
        let currentMarket = null;
        let currentTicketData = null;
        let checkInterval = null;
        let timerIntervals = {};

        // Format ISO deadline string respecting the EST toggle
        function formatTime(isoStr) {
            if (!isoStr) return '';
            const d = new Date(isoStr.replace('Z', '') + 'Z');
            const useEST = document.getElementById('timezone-toggle')?.checked;
            const pad = n => String(n).padStart(2, '0');
            if (useEST) {
                // EST = UTC-5, EDT = UTC-4. Use fixed EST offset (-5) for simplicity
                const estOffset = -5 * 60; // minutes
                const estDate = new Date(d.getTime() + estOffset * 60000);
                return `${estDate.getUTCFullYear()}-${pad(estDate.getUTCMonth()+1)}-${pad(estDate.getUTCDate())} ${pad(estDate.getUTCHours())}:${pad(estDate.getUTCMinutes())} EST`;
            } else {
                return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())} UTC`;
            }
        }

        // Wire up EST toggle — re-render all date labels on cards without full redraw
        document.getElementById('timezone-toggle').addEventListener('change', function() {
            // Force a full re-render so date labels update
            marketsData = {};
            loadMarkets();
        });

        // Format seconds into HH:MM:SS countdown string
        function fmtCountdown(secs) {
            if (secs <= 0) return '00:00:00';
            const h = Math.floor(secs / 3600);
            const m = Math.floor((secs % 3600) / 60);
            const s = secs % 60;
            const pad = n => String(n).padStart(2, '0');
            return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
        }

        // Start live countdown timers for a market card
        function startCardTimers(market) {
            // Clear any existing timer for this market
            if (timerIntervals[market.id]) {
                clearInterval(timerIntervals[market.id]);
            }

            const now = Math.floor(Date.now() / 1000);
            const betDeadline = market.betting_deadline ? Math.floor(new Date(market.betting_deadline.replace('Z','')+'Z').getTime()/1000) : 0;
            const sweatDeadline = market.sweat_deadline ? Math.floor(new Date(market.sweat_deadline.replace('Z','')+'Z').getTime()/1000) : 0;

            timerIntervals[market.id] = setInterval(() => {
                const t = Math.floor(Date.now() / 1000);

                const betEl = document.getElementById(`bet-timer-${market.id}`);
                if (betEl) {
                    const left = betDeadline - t;
                    betEl.textContent = fmtCountdown(Math.max(0, left));
                    if (left <= 0) betEl.style.color = '#ef4444';
                }

                const sweatEl = document.getElementById(`sweat-timer-${market.id}`);
                if (sweatEl) {
                    const left = sweatDeadline - t;
                    sweatEl.textContent = fmtCountdown(Math.max(0, left));
                    if (left <= 300) sweatEl.style.color = '#ef4444'; // red in last 5 min
                }
            }, 1000);
        }

        let marketsData = {}; // Cache market data by id
        let activeTab = 'all'; // currently selected category tab

        function setTab(btn) {
            document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            activeTab = btn.dataset.cat;
            // Re-render with current cached data filtered to new tab
            const all = Object.values(marketsData).filter(m => m._container === 'active-markets');
            displayMarkets(filterByTab(all), 'active-markets');
        }

        function filterByTab(markets) {
            if (activeTab === 'all') return markets;
            return markets.filter(m => (m.category || 'bitcoin') === activeTab);
        }

        function categoryBadge(category) {
            if (category === 'stocks')  return '<span style="display:inline-block;padding:3px 10px;border-radius:10px;font-size:0.7rem;font-weight:bold;text-transform:uppercase;letter-spacing:0.5px;margin-left:8px;background:rgba(59,130,246,0.18);color:#3b82f6;border:1px solid #3b82f6;">📈 STOCKS</span>';
            if (category === 'sports')  return '<span style="display:inline-block;padding:3px 10px;border-radius:10px;font-size:0.7rem;font-weight:bold;text-transform:uppercase;letter-spacing:0.5px;margin-left:8px;background:rgba(168,85,247,0.18);color:#a855f7;border:1px solid #a855f7;">🏆 SPORTS</span>';
            return ''; // bitcoin — direction badge already shown
        }

        // Returns the direction arrow + label badge for a market
        function directionLabel(direction) {
            return direction === 'down'
                ? '<span class="direction-badge direction-down">▼ DROP</span>'
                : '<span class="direction-badge direction-up">▲ PUMP</span>';
        }

        // Returns a human-readable win condition string
        function conditionText(market) {
            const cat = market.category || 'bitcoin';
            if (cat !== 'bitcoin') return 'YES wins if the correct outcome is resolved';
            const price = market.target_btc_price;
            const d = market.direction || 'up';
            const fmt = p => '$' + Number(p).toLocaleString();
            return d === 'down'
                ? `YES wins if BTC drops <strong>below ${fmt(price)}</strong>`
                : `YES wins if BTC pumps <strong>above ${fmt(price)}</strong>`;
        }

        async function loadMarkets() {
            try {
                const response = await fetch(`${API_BASE}/markets`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                const active = data.active || [];
                const resolved = data.resolved || [];

                // Re-render if market ids OR any phase/status changed
                const stateKey = m => `${m.id}:${m.phase}:${m.status}:${m.outcome||''}`;
                const activeKey  = active.map(stateKey).sort().join(',');
                const cachedKey  = Object.values(marketsData).filter(m => m._container === 'active-markets').map(stateKey).sort().join(',');

                if (activeKey !== cachedKey) {
                    // Full render needed — phase/status changed or markets added/removed
                    displayMarkets(filterByTab(active), 'active-markets');
                } else {
                    // Just update the numbers in-place, don't touch timer DOM
                    active.forEach(m => updateMarketCard(m));
                }

                // Update cache (always store full list, tab filter applied at render time)
                active.forEach(m => { marketsData[m.id] = {...m, _container: 'active-markets'}; });

                const resolvedSection = document.getElementById('resolved-section');
                const claimSection = document.getElementById('claim-section');
                claimSection.style.display = 'block';

                if (resolved.length > 0) {
                    displayMarkets(resolved, 'resolved-markets');
                    resolvedSection.style.display = 'block';
                } else {
                    resolvedSection.style.display = 'none';
                }

            } catch (error) {
                console.error('Failed to load markets:', error);
                // Don't wipe UI on transient errors
            }
        }

        function updateMarketCard(market) {
            // Update only the dynamic data fields without re-rendering or touching timers
            const yesEl = document.getElementById(`yes-pct-${market.id}`);
            const noEl = document.getElementById(`no-pct-${market.id}`);
            const poolEl = document.getElementById(`pool-${market.id}`);
            if (yesEl) yesEl.textContent = market.yes_percentage + '%';
            if (noEl) noEl.textContent = market.no_percentage + '%';
            if (poolEl) poolEl.textContent = market.total_pool.toLocaleString() + ' sats';
        }

        function displayMarkets(markets, containerId) {
            const container = document.getElementById(containerId);
            if (!markets || markets.length === 0) {
                container.innerHTML = '<div class="loading">No markets available</div>';
                return;
            }

            // Clear existing timers for markets in this container before re-rendering
            markets.forEach(m => {
                if (timerIntervals[m.id]) {
                    clearInterval(timerIntervals[m.id]);
                    delete timerIntervals[m.id];
                }
            });

            container.innerHTML = markets.map(market => {
                const isResolved = market.status === 'resolved';
                const resolvedClass = isResolved ? 'resolved' : '';
                const direction = market.direction || 'up';
                const isDown = direction === 'down';
                const extremeLabel = isDown ? 'Lowest' : 'Highest';
                const extremeValue = isDown ? market.lowest_price_during_sweat : market.highest_price_during_sweat;

                return `
                    <div class="market-card ${resolvedClass}" onclick="openMarket('${market.id}')">
                        <div>
                            <span class="status-badge status-${market.status}">${market.status}</span>
                            ${(market.category || 'bitcoin') !== 'bitcoin' ? categoryBadge(market.category) : directionLabel(direction)}
                        </div>
                        <div class="market-question">${market.question}</div>
                        
                        <div class="market-stats">
                            <div class="stat">
                                <div class="stat-label">YES</div>
                                <div class="stat-value yes-value" id="yes-pct-${market.id}">${market.yes_percentage}%</div>
                            </div>
                            <div class="stat">
                                <div class="stat-label">NO</div>
                                <div class="stat-value no-value" id="no-pct-${market.id}">${market.no_percentage}%</div>
                            </div>
                        </div>

                        <div class="market-pool">
                            Total Pool: <strong id="pool-${market.id}">${market.total_pool.toLocaleString()} sats</strong>
                        </div>

                        ${(market.status === 'resolved' || market.phase === 'resolved') ? `

                                    <div style="background: rgba(0,0,0,0.3); border-radius: 6px; padding: 8px;">

                        ` : market.phase === 'sweat' ? `
                            <div style="padding: 15px; text-align: center; border-radius: 8px; background: rgba(245, 158, 11, 0.2); margin-top: 10px;">

                                    Target: <strong>$${market.target_btc_price?.toLocaleString()}</strong>
                                </div>` : ''}

                                    <div style="color: #888; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 4px;">Game ends in</div>
                                    <div id="sweat-timer-${market.id}" style="font-family: monospace; font-size: 1.1rem; font-weight: bold; color: #f59e0b;">--:--:--</div>
                                </div>
                                <div style="color: #888; font-size: 0.78rem;">
                                    ${extremeValue ? `${extremeLabel}: $${Number(extremeValue).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}<br>` : ''}
                                    Ends: ${formatTime(market.sweat_deadline)}
                                </div>

                `;
            }).join('');

            // Start live countdown timers for all active markets
            markets.forEach(market => {
                if (market.phase === 'betting' || market.phase === 'sweat') {
                    startCardTimers(market);

        }

        async function openMarket(marketId) {
            try {
                const response = await fetch(`${API_BASE}/market/${marketId}`);
                currentMarket = await response.json();
                currentMarket.id = marketId;

                const modal = document.getElementById('bet-modal');
                const content = document.getElementById('modal-content');

                if (currentMarket.phase === 'sweat') {
                    const target = currentMarket.target_btc_price;
                    const direction = currentMarket.direction || 'up';
                    const isDown = direction === 'down';
                    const extremeLabel = isDown ? 'Lowest Seen' : 'Highest Seen';
                    const extremeVal = isDown ? (currentMarket.lowest_price_during_sweat || null) : (currentMarket.highest_price_during_sweat || null);
                    const sweatDeadlineTs = currentMarket.sweat_deadline
                        ? Math.floor(new Date(currentMarket.sweat_deadline.replace('Z','')+'Z').getTime()/1000)
                        : 0;

                    function calcPct(livePrice) {
                        if (!livePrice || !target) return 0;
                        if (isDown) {
                            const start = currentMarket.sweat_start_price || livePrice;
                            const range = start - target;
                            if (range <= 0) return 0;
                            return Math.min(100, Math.max(0, ((start - livePrice) / range) * 100));
                        }
                        return Math.min(100, (livePrice / target) * 100);
                    }

                    content.innerHTML = `
                        <h2 style="color: #f59e0b; margin-bottom: 20px;">${isDown ? '📉 SWEATING!' : '🔥 SWEATING!'}</h2>
                        <p style="color: #888; margin-bottom: 16px; font-size: 0.95rem;">${currentMarket.question}</p>
                        <div style="background: rgba(247,147,26,0.08); border: 1px solid rgba(247,147,26,0.3); border-radius: 8px; padding: 10px; margin-bottom: 16px; font-size: 0.85rem; color: #aaa; text-align: center;">
                            ${conditionText(currentMarket)}
                        </div>

                        ${                        (currentMarket.category || 'bitcoin') === 'bitcoin' ? `
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
                            <div style="background: #111; border: 1px solid #2a2a2a; border-radius: 10px; padding: 16px; text-align: center;">
                                <div style="color: #888; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">Target Price</div>
                                <div style="font-size: 1.4rem; font-weight: bold; color: var(--btc-orange);">$${target?.toLocaleString()}</div>
                                <div style="font-size: 0.7rem; color: #666; margin-top: 4px;">${isDown ? '▼ needs to DROP below' : '▲ needs to PUMP above'}</div>
                            </div>
                            <div style="background: #111; border: 1px solid #2a2a2a; border-radius: 10px; padding: 16px; text-align: center;">
                                <div style="color: #888; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">Current BTC Price</div>
                                <div id="sweat-modal-price" data-prev="${window.liveBtcPrice||''}" style="font-size: 1.4rem; font-weight: bold; color: white; transition: color 0.4s;">
                                    ${window.liveBtcPrice ? '$' + window.liveBtcPrice.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2}) : 'Loading...'}
                                </div>
                            </div>
                        </div>

                        <div style="background: #111; border: 1px solid #2a2a2a; border-radius: 10px; padding: 16px; margin-bottom: 20px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <span style="color: #888; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px;">Progress to Target</span>
                                <span id="sweat-modal-pct" style="color: var(--btc-orange); font-size: 0.85rem; font-weight: bold;"></span>
                            </div>
                            <div style="background: #222; border-radius: 4px; height: 8px; overflow: hidden;">
                                <div id="sweat-modal-bar" style="height: 100%; background: linear-gradient(90deg, var(--btc-orange), ${isDown ? 'var(--no-red)' : 'var(--yes-green)'}); border-radius: 4px; transition: width 0.5s ease; width: 0%;"></div>
                            </div>
                            <div style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 0.72rem; color: #555;">
                                <span>${extremeLabel}: <span id="sweat-modal-extreme" data-val="${extremeVal||''}">${extremeVal ? '$'+Number(extremeVal).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—'}</span></span>
                                <span>Needs: <span style="color: var(--btc-orange);">$${target?.toLocaleString()}</span></span>
                            </div>
                        </div>` : `
                        <div id="score-panel" style="background: #111; border: 1px solid #2a2a2a; border-radius: 10px; padding: 20px; margin-bottom: 20px;">
                            <div style="text-align:center; color:#888; font-size:0.85rem;">Loading score...</div>
                        </div>`}
                        <div style="background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.3); border-radius: 10px; padding: 14px; text-align: center; margin-bottom: 16px;">
                            <div style="color: #888; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">Game ends in</div>
                            <div id="sweat-modal-timer" style="font-family: monospace; font-size: 1.6rem; font-weight: bold; color: #f59e0b;">--:--:--</div>
                        </div>

                        <div style="text-align: center; color: #555; font-size: 0.8rem;">
                            Ends: ${formatTime(currentMarket.sweat_deadline)}
                        </div>
                    `;

                    // Live update loop for sweat modal
                    let sweatModalInterval = setInterval(() => {
                        // Update countdown timer (all categories)
                        const timerEl = document.getElementById('sweat-modal-timer');
                        if (timerEl && sweatDeadlineTs) {
                            const left = sweatDeadlineTs - Math.floor(Date.now() / 1000);
                            timerEl.textContent = fmtCountdown(Math.max(0, left));
                            timerEl.style.color = left <= 60 ? 'var(--no-red)' : '#f59e0b';
                        }

                        // Price tracking only for bitcoin markets
                        if ((currentMarket.category || 'bitcoin') !== 'bitcoin') return;
                        // (sports: score polling handled by fetchLiveScore interval below)

                        // Stop if modal was closed
                        if (!document.getElementById('sweat-modal-price')) {
                            clearInterval(sweatModalInterval);
                            return;
                        }

                        // Update live BTC price
                        const livePrice = window.liveBtcPrice;
                        const priceEl = document.getElementById('sweat-modal-price');
                        if (livePrice && priceEl) {
                            const formatted = '$' + livePrice.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2});
                            if (priceEl.textContent !== formatted) {
                                const prev = parseFloat(priceEl.dataset.prev || livePrice);
                                priceEl.style.color = livePrice > prev ? 'var(--yes-green)' : livePrice < prev ? 'var(--no-red)' : 'white';
                                setTimeout(() => { if (priceEl) priceEl.style.color = 'white'; }, 500);
                                priceEl.textContent = formatted;
                                priceEl.dataset.prev = livePrice;

                                // Update extreme tracker (highest for up, lowest for down)
                                const extremeEl = document.getElementById('sweat-modal-extreme');
                                if (extremeEl) {
                                    const cur = parseFloat(extremeEl.dataset.val) || (isDown ? Infinity : 0);
                                    const newExtreme = isDown ? (livePrice < cur) : (livePrice > cur);
                                    if (newExtreme || !extremeEl.dataset.val) {
                                        extremeEl.dataset.val = livePrice;
                                        extremeEl.textContent = '$' + livePrice.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2});
                                    }
                                }

                                // Update progress bar
                                const pct = calcPct(livePrice);
                                const barEl = document.getElementById('sweat-modal-bar');
                                const pctEl = document.getElementById('sweat-modal-pct');
                                if (barEl) barEl.style.width = pct.toFixed(1) + '%';
                                if (pctEl) pctEl.textContent = pct.toFixed(1) + '% of target';
                            }
                        }

                        // (countdown updated at top of interval for all categories)
                    }, 1000);

                // ── Live score polling for sports markets ──────────────────────────
                if ((currentMarket.category || 'bitcoin') === 'sports') {
                    async function fetchLiveScore() {
                        const panel = document.getElementById('score-panel');
                        if (!panel) return;

                        try {
                            const r = await fetch(`${API_BASE}/market/${currentMarket.id}/live-score`);
                            const d = await r.json();
                            if (d.error) {
                                panel.innerHTML = `<div style="text-align:center;color:#888;font-size:0.85rem;">${d.error}</div>`;
                                return;
                            }

                            const { status, home_team, away_team, home_score, away_score, commence_time } = d;

                            if (status === 'pre_game' || (home_score === null && away_score === null)) {
                                const nowMs = Date.now();
                                const sweatDeadlineMs = currentMarket.sweat_deadline
                                    ? new Date(currentMarket.sweat_deadline.replace('Z','')+'Z').getTime() : 0;
                                const startTs = commence_time
                                    ? Math.floor(new Date(commence_time.replace('Z','')+'Z').getTime()/1000) : 0;
                                const nowSec = Math.floor(nowMs / 1000);

                                if (status === 'completed' || (sweatDeadlineMs && nowMs > sweatDeadlineMs)) {
                                    // Game ended — score not available from provider
                                    const teamRow = name => `
                                        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:8px;margin-bottom:4px;">
                                            <span style="font-size:0.95rem;color:#aaa;">${name}</span>
                                            <span style="font-family:monospace;font-size:1.6rem;font-weight:bold;color:#555;">—</span>
                                        </div>`;
                                    panel.innerHTML = `
                                        <div style="text-align:center;margin-bottom:10px;">
                                            <span style="color:#888;font-size:0.72rem;font-weight:bold;text-transform:uppercase;letter-spacing:0.5px;">✅ FINAL</span>
                                        </div>
                                        ${home_team ? teamRow(home_team) : ''}
                                        ${away_team ? teamRow(away_team) : ''}
                                        <div style="text-align:center;margin-top:8px;color:#444;font-size:0.7rem;">Score unavailable from provider</div>`;
                                } else if (status === 'in_progress') {
                                    // Game is live but score not available yet
                                    const teamRow = name => `
                                        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:8px;margin-bottom:4px;">
                                            <span style="font-size:0.95rem;color:#aaa;">${name}</span>
                                            <span style="font-family:monospace;font-size:1.6rem;font-weight:bold;color:#555;">—</span>
                                        </div>`;
                                    panel.innerHTML = `
                                        <div style="text-align:center;margin-bottom:10px;">
                                            <span style="display:inline-flex;align-items:center;gap:5px;color:var(--yes-green);font-size:0.72rem;font-weight:bold;text-transform:uppercase;letter-spacing:0.5px;">
                                                <span style="width:7px;height:7px;border-radius:50%;background:var(--yes-green);display:inline-block;animation:pulse 1.5s infinite;"></span>LIVE
                                            </span>
                                        </div>
                                        ${home_team ? teamRow(home_team) : ''}
                                        ${away_team ? teamRow(away_team) : ''}
                                        <div style="text-align:center;margin-top:8px;color:#444;font-size:0.7rem;">Live score not yet available — updating every 30s</div>`;
                                } else {
                                    // Pre-game: show countdown
                                    const left = startTs ? startTs - nowSec : 0;
                                    const cd   = left > 0 ? fmtCountdown(left) : 'Starting soon';
                                    const sportLabel = currentMarket.question.toLowerCase().includes('nfl')
                                        ? '🏈 Kickoff in' : '🏀 Tip-off in';
                                    panel.innerHTML = `
                                        <div style="text-align:center;">
                                            <div style="color:#888;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">${sportLabel}</div>
                                            <div style="font-family:monospace;font-size:2rem;font-weight:bold;color:#f59e0b;">${cd}</div>
                                            <div style="color:#555;font-size:0.75rem;margin-top:8px;">${home_team || '—'} vs ${away_team || '—'}</div>
                                        </div>`;
                                }
                            } else {
                                // Live or final scoreboard
                                const homeLead   = (home_score ?? 0) > (away_score ?? 0);
                                const awayLead   = (away_score ?? 0) > (home_score ?? 0);
                                const { period_label } = d;
                                const statusBadge = status === 'completed'
                                    ? '<span style="color:var(--yes-green);font-size:0.72rem;font-weight:bold;text-transform:uppercase;letter-spacing:0.5px;">✅ FINAL</span>'
                                    : `<span style="display:inline-flex;align-items:center;gap:5px;color:var(--yes-green);font-size:0.72rem;font-weight:bold;text-transform:uppercase;letter-spacing:0.5px;"><span style="width:7px;height:7px;border-radius:50%;background:var(--yes-green);display:inline-block;animation:pulse 1.5s infinite;"></span>LIVE${period_label ? ' &nbsp;·&nbsp; ' + period_label : ''}</span>`;

                                const teamRow = (name, score, leading) =>
                                    `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:${leading ? 'rgba(34,197,94,0.08)' : 'transparent'};border-radius:8px;margin-bottom:4px;">
                                        <span style="font-size:0.95rem;font-weight:${leading ? '700' : '400'};color:${leading ? '#fff' : '#aaa'};">${name}</span>
                                        <span style="font-family:monospace;font-size:1.6rem;font-weight:bold;color:${leading ? 'var(--yes-green)' : '#888'};">${score ?? '—'}</span>
                                    </div>`;

                                panel.innerHTML = `
                                    <div style="text-align:center;margin-bottom:10px;">${statusBadge}</div>
                                    ${teamRow(home_team, home_score, homeLead)}
                                    ${teamRow(away_team, away_score, awayLead)}
                                    <div style="text-align:center;margin-top:10px;color:#444;font-size:0.7rem;">
                                        YES = ${home_team} wins &nbsp;·&nbsp; NO = ${away_team} wins
                                    </div>`;
                            }
                        } catch(e) {
                            const p = document.getElementById('score-panel');
                            if (p) p.innerHTML = '<div style="text-align:center;color:#555;font-size:0.85rem;">Score unavailable</div>';
                        }
                    }

                    fetchLiveScore();  // immediate first load
                    const scoreInterval = setInterval(() => {
                        if (!document.getElementById('score-panel')) { clearInterval(scoreInterval); return; }
                        fetchLiveScore();
                    }, 30000);  // every 30s — backend caches so quota stays safe
                }
                // ───────────────────────────────────────────────────────────────

                } else if (currentMarket.phase !== 'betting') {
                    content.innerHTML = `
                        <h2>${currentMarket.question}</h2>
                        <div style="text-align: center; padding: 40px; color: #888;">
                            ${currentMarket.outcome ? `<p style="margin-top: 20px; font-size: 1.5rem;">Outcome: <strong style="color: var(--btc-orange);">${currentMarket.outcome}</strong></p>` : '<p>Market is resolved.</p>'}
                        </div>
                    `;
                } else {
                    content.innerHTML = `
                        <h2 style="margin-bottom: 20px;">${currentMarket.question}</h2>

                        <div style="background: rgba(247,147,26,0.08); border: 1px solid rgba(247,147,26,0.3); border-radius: 8px; padding: 10px; margin-bottom: 20px; font-size: 0.85rem; color: #aaa; text-align: center;">
                            ${conditionText(currentMarket)}
                        </div>

                        <div class="market-stats" style="margin-bottom: 30px;">
                            <div class="stat">
                                <div class="stat-label">YES</div>
                                <div class="stat-value yes-value">${currentMarket.yes_percentage}%</div>
                            </div>
                            <div class="stat">
                                <div class="stat-label">NO</div>
                                <div class="stat-value no-value">${currentMarket.no_percentage}%</div>

                            <input type="number" id="bet-amount" placeholder="1000" min="100" style="width: 100%; padding: 12px; font-size: 1rem; background: #1a1a1a; border: 2px solid var(--border-color); border-radius: 8px; color: white;">
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <button onclick="placeBet('YES')" style="background: var(--yes-green); color: white; padding: 15px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer;">
                                BET YES
                            </button>
                            <button onclick="placeBet('NO')" style="background: var(--no-red); color: white; padding: 15px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer;">
                                BET NO
                            </button>
                        </div>
                    `;
                }

                modal.style.display = 'flex';
            } catch (error) {
                console.error('Failed to load market:', error);
                alert('Failed to load market details');
            }
        }

        async function placeBet(side) {
            const amount = parseInt(document.getElementById('bet-amount').value);
            if (!amount || amount < 100) {
                alert('Minimum bet is 100 sats');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/market/${currentMarket.id}/create-position`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ side: side, amount_sats: amount })
                });

                currentTicketData = await response.json();
                if (currentTicketData.error) {
                    alert(currentTicketData.error);
                    return;
                }

                displayInvoice(currentTicketData);
            } catch (error) {
                console.error('Failed to create position:', error);
                alert('Failed to create bet');
            }
        }

                    <div>
                        <p style="color: #888; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">Claim Key — Keep this safe!</p>
                        <div style="font-family: monospace; font-size: 0.8rem; word-break: break-all; color: var(--btc-orange); background: #111; padding: 10px; border-radius: 6px;">${data.signature}</div>
                    </div>
                </div>

                <p style="text-align: center; color: #555; font-size: 0.88rem;">⏳ Checking for payment every 2 seconds...</p>
            `;

            new QRCode(document.getElementById('qrcode'), {
                text: data.invoice.toUpperCase(),
                width: 240,
                height: 240,
                colorDark: '#000000',
                colorLight: '#ffffff'
            });

            startPaymentCheck(data.ticket_number, currentMarket.id);
        }

        function copyInvoice() {
            const input = document.getElementById('invoice-text');
            input.select();
            document.execCommand('copy');
            alert('Invoice copied to clipboard!');
        }

        function startPaymentCheck(ticketNumber, marketId) {
            if (checkInterval) clearInterval(checkInterval);
            checkInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE}/market/${marketId}/confirm-position/${ticketNumber}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    const data = await response.json();
                    if (data.status === 'confirmed' || data.status === 'already_confirmed') {
                        clearInterval(checkInterval);
                        checkInterval = null;
                        showPaymentSuccess({
                            ticket_number: ticketNumber,
                            side: currentTicketData.side,
                            amount_sats: currentTicketData.amount,
                            signature: currentTicketData.signature
                        });
                    }
                } catch (error) {
                    console.error('Payment check failed:', error);
                }
            }, 3000);
        }

        function showPaymentSuccess(data) {
            const content = document.getElementById('modal-content');
            const sideColor = data.side === 'YES' ? 'var(--yes-green)' : 'var(--no-red)';
            content.innerHTML = `
                <div style="text-align: center; margin-bottom: 24px;">
                    <div style="font-size: 3rem; margin-bottom: 8px;">✅</div>
                    <h2 style="color: var(--yes-green); font-size: 1.8rem;">Payment Confirmed!</h2>
                </div>

                <div style="text-align: center; margin-bottom: 24px; padding: 20px; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.3); border-radius: 12px;">
                    <p style="color: #888; font-size: 0.85rem; margin-bottom: 6px;">Your Position</p>
                    <div style="font-size: 2rem; font-weight: bold; color: ${sideColor};">${data.amount_sats.toLocaleString()} sats on ${data.side}</div>
                </div>

                <div style="padding: 20px; background: linear-gradient(135deg, #1a1a1a, #222); border: 2px solid var(--btc-orange); border-radius: 12px; margin-bottom: 16px;">
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
                        <span style="font-size: 1.1rem;">⚠️</span>
                        <span style="color: var(--btc-orange); font-weight: bold;">Save These — You'll need them to claim winnings</span>
                    </div>

                    <div style="margin-bottom: 14px;">
                        <p style="color: #888; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">Ticket Number</p>
                        <div style="font-family: monospace; font-size: 1.3rem; font-weight: bold; padding: 10px 14px; background: #111; border-radius: 6px; letter-spacing: 2px;">${data.ticket_number}</div>
                    </div>

                    <div>
                        <p style="color: #888; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">Claim Key</p>
                        <div style="font-family: monospace; font-size: 0.8rem; word-break: break-all; padding: 10px 14px; background: #111; border-radius: 6px; color: var(--btc-orange);">${data.signature}</div>
                    </div>
                </div>

                <button id="copy-all-btn" onclick="copyAllDetails('${data.amount_sats}', '${data.side}', '${data.ticket_number}', '${data.signature}')" style="width: 100%; padding: 15px; background: #2a2a2a; border: 2px solid var(--btc-orange); color: var(--btc-orange); border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 12px; transition: all 0.2s;">
                    📋 Copy All Details to Clipboard
                </button>

                <button onclick="closeModal(); loadMarkets();" style="width: 100%; padding: 15px; background: var(--btc-orange); color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer;">
                    Done
                </button>
            `;
        }

        function copyAllDetails(amount, side, ticketNumber, signature) {
            const text = `=== Satoshi's Market — Bet Receipt ===\nPosition: ${amount} sats on ${side}\nTicket Number: ${ticketNumber}\nClaim Key: ${signature}\n======================================`;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-all-btn');
                btn.textContent = '✅ Copied!';
                btn.style.background = 'rgba(34,197,94,0.15)';
                btn.style.borderColor = 'var(--yes-green)';
                btn.style.color = 'var(--yes-green)';
                setTimeout(() => {
                    btn.textContent = '📋 Copy All Details to Clipboard';
                    btn.style.background = '#2a2a2a';
                    btn.style.borderColor = 'var(--btc-orange)';
                    btn.style.color = 'var(--btc-orange)';
                }, 2500);
            }).catch(() => {
                // Fallback for older browsers
                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                const btn = document.getElementById('copy-all-btn');
                btn.textContent = '✅ Copied!';
                setTimeout(() => { btn.textContent = '📋 Copy All Details to Clipboard'; }, 2500);
            });
        }

        async function claimWinnings() {
            const ticketNumber = document.getElementById('claim-ticket-number').value.trim();
            const signature = document.getElementById('claim-signature').value.trim();
            const lightningAddress = document.getElementById('claim-lightning-address').value.trim();

            if (!ticketNumber || !signature || !lightningAddress) {
                alert('Please fill in all fields');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/claim-winnings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticket_number: ticketNumber, signature: signature, lightning_address: lightningAddress })
                });

                const data = await response.json();
                if (data.error) {
                    alert('Error: ' + data.error);
                } else {
                    alert(`Success! ${data.payout} sats sent to ${lightningAddress}`);
                    document.getElementById('claim-ticket-number').value = '';
                    document.getElementById('claim-signature').value = '';
                    document.getElementById('claim-lightning-address').value = '';
                    loadMarkets();
                }
            } catch (error) {
                console.error('Claim failed:', error);
                alert('Failed to claim winnings');
            }
        }

        function closeModal() {
            document.getElementById('bet-modal').style.display = 'none';
            if (checkInterval) {
                clearInterval(checkInterval);
                checkInterval = null;
            }
        }

        loadMarkets();
        setInterval(loadMarkets, 30000);

        // ============================================
        // BTC LIVE PRICE TICKER
        // Strategy: Try Coinbase WebSocket first (port 443, browser-friendly)
        //           Fall back to CoinGecko REST polling if WS fails within 5s
        // ============================================
        (function startTicker() {
            const priceEl  = document.getElementById('ticker-price');
            const changeEl = document.getElementById('ticker-change');
            const dotEl    = document.getElementById('ticker-dot');
            const statusEl = document.getElementById('ticker-status-text');

            let lastPrice     = null;
            let openPrice     = null;
            let ws            = null;
            let usingFallback = false;
            let fallbackTimer = null;
            let wsConnected   = false;

            function setStatus(live, label) {
                dotEl.className      = 'ticker-dot' + (live ? ' live' : '');
                statusEl.textContent = label || (live ? 'Live' : 'Reconnecting...');
            }

            function formatPrice(p) {
                return '$' + Number(p).toLocaleString('en-US', {
                    minimumFractionDigits: 2, maximumFractionDigits: 2
                });
            }

            function updateDisplay(price) {
                if (!openPrice) return;
                const diff  = price - openPrice;
                const pct   = (diff / openPrice) * 100;
                const dir   = diff >= 0 ? 'up' : 'down';
                const arrow = diff >= 0 ? '▲' : '▼';

                if (lastPrice !== null && price !== lastPrice) {
                    priceEl.className = 'ticker-price ' + (price > lastPrice ? 'up' : 'down');
                    setTimeout(() => { priceEl.className = 'ticker-price'; }, 600);
                }

                priceEl.textContent    = formatPrice(price);
                changeEl.style.display = '';
                changeEl.className     = 'ticker-change ' + dir;
                changeEl.textContent   = `${arrow} ${Math.abs(pct).toFixed(2)}% (${diff >= 0 ? '+' : ''}${formatPrice(diff)})`;
                lastPrice = price;
                window.liveBtcPrice = price;
            }

            // Fetch 24h open price from Coinbase stats
            async function fetchOpenPrice() {
                try {
                    const r = await fetch('https://api.exchange.coinbase.com/products/BTC-USD/stats');
                    const d = await r.json();
                    openPrice = parseFloat(d.open);
                } catch(e) {
                    console.log('[Ticker] Could not fetch open price:', e);
                }
            }

            // --- REST POLLING FALLBACK (CoinGecko) ---
            let pollInterval = null;
            async function pollCoinGecko() {
                try {
                    const r = await fetch(
                        'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true',
                        { cache: 'no-store' }
                    );
                    const d = await r.json();
                    const price  = d.bitcoin.usd;
                    const change = d.bitcoin.usd_24h_change;
                    if (!openPrice) openPrice = price / (1 + change / 100);
                    updateDisplay(price);
                    window.liveBtcPrice = price;
                    setStatus(true, 'Live (polling)');
                } catch(e) {
                    setStatus(false, 'No feed');
                }
            }

            function startFallback() {
                if (usingFallback) return;
                usingFallback = true;
                if (ws) { try { ws.close(); } catch(e){} ws = null; }
                console.log('[Ticker] WebSocket failed, switching to REST polling');
                pollCoinGecko();
                pollInterval = setInterval(pollCoinGecko, 15000);
            }

            // --- COINBASE WEBSOCKET ---
            function connectWS() {
                if (usingFallback) return;
                wsConnected = false;

                fallbackTimer = setTimeout(() => {
                    if (!wsConnected) {
                        console.log('[Ticker] WS timeout, switching to REST');
                        startFallback();
                    }
                }, 5000);

                try {
                    ws = new WebSocket('wss://advanced-trade-ws.coinbase.com');

                    ws.onopen = () => {
                        ws.send(JSON.stringify({
                            type: 'subscribe',
                            product_ids: ['BTC-USD'],
                            channel: 'ticker'
                        }));
                    };

                    ws.onmessage = (e) => {
                        try {
                            const msg = JSON.parse(e.data);
                            const events = msg.events || [];
                            for (const ev of events) {
                                const tickers = ev.tickers || [];
                                for (const t of tickers) {
                                    if (t.product_id !== 'BTC-USD') continue;
                                    const price = parseFloat(t.price);
                                    if (!price) continue;
                                    wsConnected = true;
                                    clearTimeout(fallbackTimer);
                                    updateDisplay(price);
                                    setStatus(true, 'Live');
                                }
                            }
                        } catch(err) {}
                    };

                    ws.onerror = () => { if (!wsConnected) startFallback(); };

                    ws.onclose = () => {
                        if (!usingFallback && wsConnected) {
                            setStatus(false);
                            setTimeout(connectWS, 5000);
                        } else if (!usingFallback) {
                            startFallback();
                        }
                    };

                } catch(e) {
                    startFallback();
                }
            }

            fetchOpenPrice().then(connectWS);
        })();
        // ============================================
        // END TICKER
        // ============================================
        // ============================================
        // END TICKER
        // ============================================
    </script>
</body>
</html>
