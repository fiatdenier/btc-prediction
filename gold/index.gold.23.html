<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satoshi's Market - Bitcoin Prediction Markets</title>
    <meta property="og:title" content="Satoshi's Market ⚡">
    <meta property="og:description" content="Sudden death Bitcoin prediction market. Winners take 95% of the pool.">
    <meta property="og:image" content="https://fiatdenier.com/satoshi.png">
    <meta property="og:url" content="https://fiatdenier.com/btc-prediction/">
    <meta property="og:type" content="website">
    <style>
        :root {
            --btc-orange: #f7931a;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --yes-green: #22c55e;
            --no-red: #ef4444;
            --border-color: #2a2a2a;
            --resolved-green: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--dark-bg);
            color: white;
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            padding: 20px 0 40px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            color: var(--btc-orange);
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .subtitle { 
            color: #888; 
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .markets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .market-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .market-card:hover {
            border-color: var(--btc-orange);
            transform: translateY(-2px);
        }

        .market-card.resolved {
            border-color: var(--resolved-green);
            background: linear-gradient(135deg, #1a1a1a 0%, #1a2a1a 100%);
        }

        .market-card.resolved:hover {
            border-color: var(--resolved-green);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }

        .market-question {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
            min-height: 60px;
        }

        .market-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .stat { text-align: center; }

        .stat-label {
            color: #888;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .stat-value { font-size: 1.5rem; font-weight: bold; }
        .yes-value { color: var(--yes-green); }
        .no-value { color: var(--no-red); }

        .market-pool {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .market-pool strong { color: var(--btc-orange); }

        .countdown {
            background: rgba(247, 147, 26, 0.1);
            border: 1px solid var(--btc-orange);
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            text-align: center;
        }

        .countdown-label {
            color: #888;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .countdown-time {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--btc-orange);
        }

        .countdown-units {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-top: 5px;
        }

        .countdown-unit {
            text-align: center;
        }

        .countdown-unit .number {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--btc-orange);
            display: block;
        }

        .countdown-unit .label {
            font-size: 0.65rem;
            color: #888;
            text-transform: uppercase;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .status-open { background: rgba(34, 197, 94, 0.2); color: var(--yes-green); }
        .status-closed { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .status-resolved { 
            background: rgba(34, 197, 94, 0.3); 
            color: var(--resolved-green);
            border: 1px solid var(--resolved-green);
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ccc;
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .category-tab {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: #888;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }

        .category-tab:hover {
            border-color: var(--btc-orange);
            color: var(--btc-orange);
        }

        .category-tab.active {
            background: var(--btc-orange);
            border-color: var(--btc-orange);
            color: #000;
        }

        .category-tab.tab-stocks.active  { background: #3b82f6; border-color: #3b82f6; color: #fff; }
        .category-tab.tab-stocks:hover   { border-color: #3b82f6; color: #3b82f6; }
        .category-tab.tab-sports.active  { background: #a855f7; border-color: #a855f7; color: #fff; }
        .category-tab.tab-sports:hover   { border-color: #a855f7; color: #a855f7; }

        .sports-subtabs {
            display: none;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #1e1e1e;
        }
        .sports-subtabs.visible { display: flex; }
        .sports-subtab {
            padding: 5px 14px;
            border-radius: 16px;
            border: 1px solid #444;
            background: transparent;
            color: #aaa;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.15s;
        }
        .sports-subtab:hover  { border-color: #a855f7; color: #a855f7; }
        .sports-subtab.active { background: #a855f7; border-color: #a855f7; color: #fff; }

        /* BTC Live Ticker */
        .btc-ticker {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            margin-bottom: 32px;
            font-family: 'Courier New', monospace;
        }

        .ticker-icon {
            font-size: 1.3rem;
        }

        .ticker-label {
            color: #888;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ticker-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--btc-orange);
            transition: color 0.4s ease;
            min-width: 120px;
        }

        .ticker-price.up   { color: var(--yes-green); }
        .ticker-price.down { color: var(--no-red); }

        .ticker-change {
            font-size: 0.9rem;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 6px;
        }

        .ticker-change.up   { background: rgba(34,197,94,0.15);  color: var(--yes-green); }
        .ticker-change.down { background: rgba(239,68,68,0.15);   color: var(--no-red); }

        .ticker-status {
            margin-left: auto;
            font-size: 0.72rem;
            color: #555;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ticker-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #555;
            flex-shrink: 0;
        }

        .ticker-dot.live { background: var(--yes-green); animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #888;
            font-size: 1.1rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--btc-orange);
            border-radius: 16px;
            width: 100%;
            max-width: 760px;
            margin: 40px auto;
            padding: 40px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: #888;
            background: none;
            border: none;
        }

        .close-modal:hover { color: white; }

        .action-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-yes { background: var(--yes-green); color: white; }
        .btn-yes:hover { background: #16a34a; }
        .btn-no { background: var(--no-red); color: white; }
        .btn-no:hover { background: #dc2626; }

        input {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        input:focus {
            outline: none;
            border-color: var(--btc-orange);
        }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .quick-amt-btn {
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .quick-amt-btn:hover {
            background: #3a3a3a;
            border-color: var(--btc-orange);
        }

        .claim-section {
            background: var(--card-bg);
            border: 2px solid var(--yes-green);
            border-radius: 12px;
            padding: 30px;
            margin-top: 40px;
        }

        .ticket-display {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 2px solid var(--btc-orange);
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
            text-align: center;
        }

        /* Direction indicator badge */
        .direction-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 8px;
            vertical-align: middle;
        }
        .direction-up   { background: rgba(34,197,94,0.18); color: var(--yes-green); border: 1px solid var(--yes-green); }
        .direction-down { background: rgba(239,68,68,0.18);  color: var(--no-red);   border: 1px solid var(--no-red); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>⚡ Satoshi's Market</h1>
                    <div class="subtitle">Predict the Future. Win Sats. Powered by Lightning Network ⚡</div>
                </div>
                <div style="text-align: right;">
                    <label style="color: #888; font-size: 0.9rem; cursor: pointer;">
                        <input type="checkbox" id="timezone-toggle" style="margin-right: 8px;">
                        Show times in ET (default: UTC)
                    </label>
                </div>
            </div>
        </header>

        <!-- BTC Live Price Ticker -->
        <div class="btc-ticker">
            <span class="ticker-icon">₿</span>
            <div>
                <div class="ticker-label">BTC / USD</div>
                <div class="ticker-price" id="ticker-price">Connecting...</div>
            </div>
            <div id="ticker-change" class="ticker-change" style="display:none;"></div>
            <div class="ticker-status">
                <div class="ticker-dot" id="ticker-dot"></div>
                <span id="ticker-status-text">Connecting to live feed...</span>
            </div>
        </div>

        <h2 class="section-title">🔥 Active Markets</h2>

        <div class="category-tabs">
            <button class="category-tab active"        data-cat="all"     onclick="setTab(this)">All</button>
            <button class="category-tab"               data-cat="bitcoin" onclick="setTab(this)">₿ Bitcoin</button>
            <button class="category-tab tab-stocks"    data-cat="stocks"  onclick="setTab(this)">📈 Stocks</button>
            <button class="category-tab tab-sports"    data-cat="sports"  onclick="setTab(this)">🏆 Sports</button>
        </div>

        <!-- Sports league sub-tabs — only visible when Sports tab is active -->
        <div class="sports-subtabs" id="sports-subtabs">
            <button class="sports-subtab active" data-league="all"   onclick="setSportsLeague(this)">All Sports</button>
            <button class="sports-subtab"        data-league="nba"   onclick="setSportsLeague(this)">🏀 NBA</button>
            <button class="sports-subtab"        data-league="nfl"   onclick="setSportsLeague(this)">🏈 NFL</button>
            <button class="sports-subtab"        data-league="ncaab" onclick="setSportsLeague(this)">🏀 NCAAB</button>
            <button class="sports-subtab"        data-league="ncaaf" onclick="setSportsLeague(this)">🏈 NCAAF</button>
        </div>

        <div id="active-markets" class="markets-grid">
            <div class="loading">Loading markets...</div>
        </div>

        <div id="resolved-section" style="display: none; margin-top: 60px;">
            <h2 class="section-title">✅ Recently Resolved</h2>
            <div style="display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;">
                <button class="resolved-tab active" data-cat="all" onclick="setResolvedTab(this)" style="padding: 8px 18px; border-radius: 20px; border: 1px solid #444; background: var(--btc-orange); color: #000; font-weight: bold; cursor: pointer; font-size: 0.85rem;">All</button>
                <button class="resolved-tab" data-cat="bitcoin" onclick="setResolvedTab(this)" style="padding: 8px 18px; border-radius: 20px; border: 1px solid #444; background: transparent; color: #aaa; cursor: pointer; font-size: 0.85rem;">₿ Bitcoin</button>
                <button class="resolved-tab" data-cat="stocks" onclick="setResolvedTab(this)" style="padding: 8px 18px; border-radius: 20px; border: 1px solid #444; background: transparent; color: #aaa; cursor: pointer; font-size: 0.85rem;">📈 Stocks</button>
                <button class="resolved-tab" data-cat="sports" onclick="setResolvedTab(this)" style="padding: 8px 18px; border-radius: 20px; border: 1px solid #444; background: transparent; color: #aaa; cursor: pointer; font-size: 0.85rem;">🏆 Sports</button>
            </div>
            <div id="resolved-markets" class="markets-grid"></div>
        </div>

        <!-- Claim Winnings Section -->
        <div id="claim-section" class="claim-section" style="display: none;">
            <h2 style="margin-top: 0;">💰 Claim Your Winnings</h2>
            
            <p style="color: #888; margin-bottom: 20px;">
                If you have a winning ticket, enter your details below to claim your payout.
            </p>

            <input type="text" id="claim-ticket-number" placeholder="Ticket Number (e.g., ABC123XY)">
            <input type="text" id="claim-signature" placeholder="Claim Key (your secret signature)" style="font-family: monospace;">
            <input type="text" id="claim-lightning-address" placeholder="Lightning Address (you@getalby.com) or Invoice">

            <button class="action-btn btn-yes" onclick="claimWinnings()">
                💸 CLAIM WINNINGS
            </button>

            <div id="claim-status" style="margin-top: 20px;"></div>
        </div>
    </div>

    <!-- Bet Modal -->
    <div id="bet-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <script>
        const API_BASE = 'https://predict.fiatdenier.com/api';
        let currentMarket = null;
        let currentTicketData = null;
        let checkInterval = null;
        let timerIntervals = {};

        // Format ISO deadline string respecting the EST toggle
        function formatTime(isoStr) {
            if (!isoStr) return '';
            const d = new Date(isoStr.replace('Z', '') + 'Z');
            const useEST = document.getElementById('timezone-toggle')?.checked;
            const pad = n => String(n).padStart(2, '0');
            if (useEST) {
                // DST-aware Eastern Time via Intl.DateTimeFormat (EDT in summer, EST in winter)
                const parts = new Intl.DateTimeFormat('en-US', {
                    timeZone: 'America/New_York',
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', hour12: false
                }).formatToParts(d);
                const p = {};
                parts.forEach(x => p[x.type] = x.value);
                const isDST = !d.toLocaleString('en-US', { timeZone: 'America/New_York', timeZoneName: 'short' }).includes('EST');
                const suffix = isDST ? 'EDT' : 'EST';
                const hour = p.hour === '24' ? '00' : p.hour;
                return `${p.year}-${p.month}-${p.day} ${hour}:${p.minute} ${suffix}`;
            } else {
                return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())} UTC`;
            }
        }

        // Wire up EST toggle — re-render all date labels on cards without full redraw
        document.getElementById('timezone-toggle').addEventListener('change', function() {
            // Force a full re-render so date labels update
            marketsData = {};
            loadMarkets();
        });

        // Format seconds into HH:MM:SS countdown string
        function fmtCountdown(secs) {
            if (secs <= 0) return '00:00:00';
            const h = Math.floor(secs / 3600);
            const m = Math.floor((secs % 3600) / 60);
            const s = secs % 60;
            const pad = n => String(n).padStart(2, '0');
            return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
        }

        // Start live countdown timers for a market card
        function startCardTimers(market) {
            // Clear any existing timer for this market
            if (timerIntervals[market.id]) {
                clearInterval(timerIntervals[market.id]);
            }

            const now = Math.floor(Date.now() / 1000);
            const betDeadline = market.betting_deadline ? Math.floor(new Date(market.betting_deadline.replace('Z','')+'Z').getTime()/1000) : 0;
            const sweatDeadline = market.sweat_deadline ? Math.floor(new Date(market.sweat_deadline.replace('Z','')+'Z').getTime()/1000) : 0;

            timerIntervals[market.id] = setInterval(() => {
                const t = Math.floor(Date.now() / 1000);

                const betEl = document.getElementById(`bet-timer-${market.id}`);
                if (betEl) {
                    const left = betDeadline - t;
                    betEl.textContent = fmtCountdown(Math.max(0, left));
                    if (left <= 0) betEl.style.color = '#ef4444';
                }

                const sweatEl = document.getElementById(`sweat-timer-${market.id}`);
                if (sweatEl) {
                    const left = sweatDeadline - t;
                    sweatEl.textContent = fmtCountdown(Math.max(0, left));
                    if (left <= 300) sweatEl.style.color = '#ef4444'; // red in last 5 min
                }
            }, 1000);
        }

        let marketsData = {}; // Cache market data by id
        let activeTab = 'all'; // currently selected category tab
        let resolvedData = []; // Cache resolved markets for tab filtering
        const scoreCache = {}; // Cache scores by marketId for resolved cards
        let activeResolvedTab = 'all'; // currently selected resolved tab
        let activeSportsLeague = 'all'; // sub-tab when Sports tab active

        function detectLeague(market) {
            const q = (market.question || '').toLowerCase();
            if (q.includes('ncaaf')) return 'ncaaf';
            if (q.includes('ncaab') || q.includes('ncaa')) return 'ncaab';
            if (q.includes('nfl'))  return 'nfl';
            if (q.includes('nba'))  return 'nba';
            return 'other';
        }

        function setSportsLeague(btn) {
            document.querySelectorAll('.sports-subtab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            activeSportsLeague = btn.dataset.league;
            const all = Object.values(marketsData).filter(m => m._container === 'active-markets');
            displayMarkets(filterByTab(all), 'active-markets');
        }

        function setTab(btn) {
            document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            activeTab = btn.dataset.cat;
            // Show/hide sports sub-tabs
            const subtabs = document.getElementById('sports-subtabs');
            if (subtabs) subtabs.classList.toggle('visible', activeTab === 'sports');
            // Re-render with current cached data filtered to new tab
            const all = Object.values(marketsData).filter(m => m._container === 'active-markets');
            displayMarkets(filterByTab(all), 'active-markets');
        }

        function filterResolvedByTab(markets) {
            if (activeResolvedTab === 'all') return markets;
            return markets.filter(m => (m.category || 'bitcoin') === activeResolvedTab);
        }

        function setResolvedTab(btn) {
            document.querySelectorAll('.resolved-tab').forEach(t => {
                t.style.background = 'transparent';
                t.style.color = '#aaa';
                t.style.borderColor = '#444';
            });
            btn.style.background = 'var(--btc-orange)';
            btn.style.color = '#000';
            btn.style.borderColor = 'var(--btc-orange)';
            activeResolvedTab = btn.dataset.cat;
            displayMarkets(filterResolvedByTab(resolvedData), 'resolved-markets');
            filterResolvedByTab(resolvedData).forEach(m => {
                if ((m.category||'bitcoin') === 'sports') renderResolvedScore(m.id);
            });
        }

        function sortBySoonest(markets) {
            return [...markets].sort((a, b) => {
                const aTs = a.betting_deadline ? new Date(a.betting_deadline.replace('Z','')+'Z').getTime() : Infinity;
                const bTs = b.betting_deadline ? new Date(b.betting_deadline.replace('Z','')+'Z').getTime() : Infinity;
                return aTs - bTs;
            });
        }

        function filterByTab(markets) {
            if (activeTab === 'all') return sortBySoonest(markets);
            let filtered = markets.filter(m => (m.category || 'bitcoin') === activeTab);
            // Apply sports league sub-filter
            if (activeTab === 'sports' && activeSportsLeague !== 'all') {
                filtered = filtered.filter(m => detectLeague(m) === activeSportsLeague);
            }
            return sortBySoonest(filtered);
        }

        function categoryBadge(category, market) {
            if (category === 'stocks')  return '<span style="display:inline-block;padding:3px 10px;border-radius:10px;font-size:0.7rem;font-weight:bold;text-transform:uppercase;letter-spacing:0.5px;margin-left:8px;background:rgba(59,130,246,0.18);color:#3b82f6;border:1px solid #3b82f6;">📈 STOCKS</span>';
            if (category === 'sports') {
                const league = market ? detectLeague(market) : 'other';
                const label = league === 'nba' ? '🏀 NBA' : league === 'nfl' ? '🏈 NFL' : league === 'ncaab' ? '🏀 NCAAB' : league === 'ncaaf' ? '🏈 NCAAF' : '🏆 SPORTS';
                return '<span style="display:inline-block;padding:3px 10px;border-radius:10px;font-size:0.7rem;font-weight:bold;text-transform:uppercase;letter-spacing:0.5px;margin-left:8px;background:rgba(168,85,247,0.18);color:#a855f7;border:1px solid #a855f7;">' + label + '</span>';
            }
            return ''; // bitcoin -- direction badge already shown
        }

        // Returns the direction arrow + label badge for a market
        function directionLabel(direction) {
            return direction === 'down'
                ? '<span class="direction-badge direction-down">▼ DROP</span>'
                : '<span class="direction-badge direction-up">▲ PUMP</span>';
        }

        // Returns a human-readable win condition string
        function conditionText(market) {
            const cat = market.category || 'bitcoin';
            if (cat !== 'bitcoin') return 'YES wins if the correct outcome is resolved';
            const price = market.target_btc_price;
            const d = market.direction || 'up';
            const fmt = p => '$' + Number(p).toLocaleString();
            return d === 'down'
                ? `YES wins if BTC drops <strong>below ${fmt(price)}</strong>`
                : `YES wins if BTC pumps <strong>above ${fmt(price)}</strong>`;
        }

        async function loadMarkets() {
            try {
                const response = await fetch(`${API_BASE}/markets`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                const active = data.active || [];
                const resolved = data.resolved || [];

                // Re-render if market ids OR any phase/status changed
                const stateKey = m => `${m.id}:${m.phase}:${m.status}:${m.outcome||''}`;
                const activeKey  = active.map(stateKey).sort().join(',');
                const cachedKey  = Object.values(marketsData).filter(m => m._container === 'active-markets').map(stateKey).sort().join(',');

                // Update cache first so fetchCardScore/fetchCardPrice can read ticker etc.
                active.forEach(m => { marketsData[m.id] = {...m, _container: 'active-markets'}; });

                if (activeKey !== cachedKey) {
                    // Full render needed — phase/status changed or markets added/removed
                    displayMarkets(filterByTab(active), 'active-markets');
                    // Re-fetch card data immediately after re-render
                    active.forEach(m => {
                        if (m.phase === 'sweat') {
                            const cat = m.category || 'bitcoin';
                            if (cat === 'sports') fetchCardScore(m.id);
                            else if (cat === 'stocks') fetchCardPrice(m.id, m);
                        }
                    });
                } else {
                    // Just update the numbers in-place, don't touch timer DOM
                    active.forEach(m => updateMarketCard(m));
                }

                const resolvedSection = document.getElementById('resolved-section');
                const claimSection = document.getElementById('claim-section');
                claimSection.style.display = 'block';

                if (resolved.length > 0) {
                    resolvedData = resolved;
                    // Store resolved markets in marketsData so renderResolvedScore can read final scores
                    resolved.forEach(m => { marketsData[m.id] = {...m, _container: 'resolved-markets'}; });
                    displayMarkets(filterResolvedByTab(resolved), 'resolved-markets');
                    resolvedSection.style.display = 'block';
                    resolved.forEach(m => {
                        if ((m.category||'bitcoin') === 'sports') renderResolvedScore(m.id);
                    });
                } else {
                    resolvedData = [];
                    resolvedSection.style.display = 'none';
                }

            } catch (error) {
                console.error('Failed to load markets:', error);
                // Don't wipe UI on transient errors
            }
        }

        function updateMarketCard(market) {
            // Update only the dynamic data fields without re-rendering or touching timers
            const yesEl = document.getElementById(`yes-pct-${market.id}`);
            const noEl = document.getElementById(`no-pct-${market.id}`);
            const poolEl = document.getElementById(`pool-${market.id}`);
            if (yesEl) yesEl.textContent = market.yes_percentage + '%';
            if (noEl) noEl.textContent = market.no_percentage + '%';
            if (poolEl) poolEl.textContent = market.total_pool.toLocaleString() + ' sats';
            // Refresh sports card score on poll; stocks has its own 30s interval
            if (market.phase === 'sweat') {
                const cat = market.category || 'bitcoin';
                if (cat === 'sports') fetchCardScore(market.id);
                // stocks: 30s interval set when card was first rendered
            }
        }

        function displayMarkets(markets, containerId) {
            const container = document.getElementById(containerId);
            if (!markets || markets.length === 0) {
                container.innerHTML = '<div class="loading">No markets available</div>';
                return;
            }

            // Clear existing timers for markets in this container before re-rendering
            markets.forEach(m => {
                if (timerIntervals[m.id]) {
                    clearInterval(timerIntervals[m.id]);
                    delete timerIntervals[m.id];
                }
            });

            container.innerHTML = markets.map(market => {
                const isResolved = market.status === 'resolved';
                const resolvedClass = isResolved ? 'resolved' : '';
                const direction = market.direction || 'up';
                const isDown = direction === 'down';
                const extremeLabel = isDown ? 'Lowest' : 'Highest';
                const extremeValue = isDown ? market.lowest_price_during_sweat : market.highest_price_during_sweat;

                return `
                    <div class="market-card ${resolvedClass}" onclick="openMarket('${market.id}')">
                        <div>
                            <span class="status-badge status-${market.status}">${market.status}</span>
                            ${(market.category || 'bitcoin') !== 'bitcoin' ? categoryBadge(market.category, market) : directionLabel(direction)}
                        </div>
                        <div class="market-question">
                            ${market.question}
                            <span style="color:#555;font-size:0.65rem;font-weight:normal;margin-left:6px;">#${market.id.slice(-6)}</span>
                        </div>
                        
                        <div class="market-stats">
                            <div class="stat">
                                <div class="stat-label">YES</div>
                                <div class="stat-value yes-value" id="yes-pct-${market.id}">${market.yes_percentage}%</div>
                            </div>
                            <div class="stat">
                                <div class="stat-label">NO</div>
                                <div class="stat-value no-value" id="no-pct-${market.id}">${market.no_percentage}%</div>
                            </div>
                        </div>

                        <div class="market-pool">
                            Total Pool: <strong id="pool-${market.id}">${market.total_pool.toLocaleString()} sats</strong>
                        </div>

                        ${(market.status === 'resolved' || market.phase === 'resolved') ? `
                            <div style="margin-top: 10px; padding: 10px; background: rgba(34, 197, 94, 0.1); border-radius: 8px; text-align: center;">
                                <div style="color: var(--resolved-green); font-weight: bold; font-size: 1.1rem; margin-bottom: ${(market.category||'bitcoin')==='sports' ? '6px' : '0'};">
                                    ✅ ${market.outcome ? market.outcome + ' Won' : 'Resolved'}
                                </div>
                                ${(market.category||'bitcoin')==='sports' ? '<div id="resolved-score-' + market.id + '" style="font-size:0.82rem;"></div>' : ''}
                            </div>
                        ` : market.phase === 'betting' ? `
                            <div style="padding: 15px; text-align: center; border-radius: 8px; background: rgba(34, 197, 94, 0.2); margin-top: 10px;">
                                <div style="color: #22c55e; font-weight: bold; font-size: 1.1rem; margin-bottom: 8px;">
                                    ⏰ BETTING OPEN
                                </div>
                                <div style="font-size: 0.8rem; color: #aaa; margin-bottom: 8px;">${conditionText(market)}</div>
                                <div style="display: grid; grid-template-columns: ${(market.category||'bitcoin')==='bitcoin' ? '1fr 1fr' : '1fr'}; gap: 10px; margin-bottom: 8px;">
                                    <div style="background: rgba(0,0,0,0.3); border-radius: 6px; padding: 8px;">
                                        <div style="color: #888; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 4px;">Betting closes in</div>
                                        <div id="bet-timer-${market.id}" style="font-family: monospace; font-size: 1rem; font-weight: bold; color: #22c55e;">--:--:--</div>
                                    </div>
                                    ${(market.category||'bitcoin')==='bitcoin' ? `
                                    <div style="background: rgba(0,0,0,0.3); border-radius: 6px; padding: 8px;">
                                        <div style="color: #888; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 4px;">Game ends in</div>
                                        <div id="sweat-timer-${market.id}" style="font-family: monospace; font-size: 1rem; font-weight: bold; color: #f59e0b;">--:--:--</div>
                                    </div>` : ''}
                                </div>
                                <div style="color: #666; font-size: 0.78rem;">
                                    Betting closes: ${formatTime(market.betting_deadline)}<br>
                                    ${(market.category||'bitcoin')==='bitcoin' && market.sweat_deadline ? `Game ends: ${formatTime(market.sweat_deadline)}` : ''}
                                </div>
                            </div>
                        ` : market.phase === 'sweat' ? `
                            <div style="padding: 15px; text-align: center; border-radius: 8px; background: rgba(245, 158, 11, 0.2); margin-top: 10px;">
                                <div style="color: #f59e0b; font-weight: bold; font-size: 1.1rem; margin-bottom: 8px;">
                                    ${isDown ? '📉 SWEATING!' : '🔥 SWEATING!'}
                                </div>
                                <div style="font-size: 0.8rem; color: #aaa; margin-bottom: 8px;">${conditionText(market)}</div>
                                ${(market.category || 'bitcoin') === 'bitcoin' ? `
                                <div style="color: #fff; font-size: 1rem; margin-bottom: 8px;">
                                    Target: <strong>$${market.target_btc_price?.toLocaleString()}</strong>
                                </div>
                                <div style="background: rgba(0,0,0,0.3); border-radius: 6px; padding: 8px; margin-bottom: 8px;">
                                    <div style="color: #888; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 4px;">Game ends in</div>
                                    <div id="sweat-timer-${market.id}" style="font-family: monospace; font-size: 1.1rem; font-weight: bold; color: #f59e0b;">--:--:--</div>
                                </div>
                                <div style="color: #888; font-size: 0.78rem;">
                                    ${extremeValue ? `${extremeLabel}: $${Number(extremeValue).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}<br>` : ''}
                                    Ends: ${formatTime(market.sweat_deadline)}
                                </div>` : (market.category || 'bitcoin') === 'sports' ? `
                                <div id="card-score-${market.id}" style="background: rgba(0,0,0,0.3); border-radius: 6px; padding: 8px; margin-bottom: 8px; color: #888; font-size: 0.82rem;">
                                    Loading score...
                                </div>` : `
                                <div id="card-price-${market.id}" style="background: rgba(0,0,0,0.3); border-radius: 6px; padding: 8px; margin-bottom: 8px;">
                                    <div style="color: #888; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 4px;">Current Price</div>
                                    <div style="font-family: monospace; font-size: 1rem; font-weight: bold; color: #fff;">Loading...</div>
                                </div>`}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            // Start live countdown timers for all active markets
            markets.forEach(market => {
                if (market.phase === 'betting' || market.phase === 'sweat') {
                    startCardTimers(market);
                }
            });

            // Fetch live scores/prices for sweat cards
            markets.forEach(market => {
                if (market.phase === 'sweat') {
                    const cat = market.category || 'bitcoin';
                    if (cat === 'sports') fetchCardScore(market.id);
                    else if (cat === 'stocks') fetchCardPrice(market.id, market);
                }
            });
        }

        // Fetch and render score into a market card's score div
        function renderResolvedScore(marketId) {
            const el = document.getElementById('resolved-score-' + marketId);
            if (!el) return;
            // Priority: 1) marketsData (final_* fields saved at resolution, survives restarts)
            //           2) scoreCache (live memory, populated during sweat phase)
            //           3) hide gracefully
            const md = marketsData[marketId];
            let s = scoreCache[marketId];
            if (!s && md && md.final_home_score != null) {
                s = { home_team: md.final_home_team, away_team: md.final_away_team,
                      home_score: md.final_home_score, away_score: md.final_away_score };
            }
            if (!s) { el.style.display = 'none'; return; }
            const { home_team, away_team, home_score, away_score } = s;
            const homeLead = (home_score ?? 0) >= (away_score ?? 0);
            el.innerHTML =
                '<div style="display:flex;justify-content:space-between;padding:2px 8px;color:' + (homeLead?'#fff':'#aaa') + ';font-weight:' + (homeLead?'bold':'normal') + ';">' +
                    '<span>' + home_team + '</span><span style="font-family:monospace;color:' + (homeLead?'var(--yes-green)':'#888') + ';">' + home_score + '</span>' +
                '</div>' +
                '<div style="display:flex;justify-content:space-between;padding:2px 8px;color:' + (!homeLead?'#fff':'#aaa') + ';font-weight:' + (!homeLead?'bold':'normal') + ';">' +
                    '<span>' + away_team + '</span><span style="font-family:monospace;color:' + (!homeLead?'var(--yes-green)':'#888') + ';">' + away_score + '</span>' +
                '</div>';
        }

        async function fetchCardPrice(marketId, market) {
            const el = document.getElementById('card-price-' + marketId);
            if (!el) return;
            const m = market || marketsData[marketId];
            if (!m || !m.ticker) return;
            // Don't poll resolved markets
            if (m.status === 'resolved' || m.phase === 'resolved') { el.style.display = 'none'; return; }
            const market_obj = m;
            try {
                const r = await fetch(API_BASE + '/market/' + marketId + '/live-score');
                const d = await r.json();
                // Stocks live-score endpoint returns current_price
                if (d.current_price != null) {
                    const target = market_obj.target_price || market_obj.target_btc_price;
                    const direction = market_obj.direction || 'up';
                    const hit = direction === 'up' ? d.current_price >= target : d.current_price <= target;
                    const color = hit ? 'var(--yes-green)' : '#fff';
                    el.innerHTML =
                        '<div style="color:#888;font-size:0.7rem;text-transform:uppercase;margin-bottom:4px;">Current Price</div>' +
                        '<div style="font-family:monospace;font-size:1rem;font-weight:bold;color:' + color + ';">$' + Number(d.current_price).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + '</div>' +
                        '<div style="color:#888;font-size:0.7rem;margin-top:2px;">Target: $' + Number(target).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + '</div>';
                } else {
                    el.innerHTML = '<div style="color:#888;font-size:0.7rem;text-transform:uppercase;margin-bottom:4px;">Current Price</div><div style="color:#555;font-size:0.8rem;">Market closed</div>';
                }
            } catch(e) {
                const el2 = document.getElementById('card-price-' + marketId);
                if (el2) el2.innerHTML = '<div style="color:#888;font-size:0.7rem;text-transform:uppercase;margin-bottom:4px;">Current Price</div><div style="color:#555;font-size:0.8rem;">Unavailable</div>';
            }
        }

        async function fetchCardScore(marketId) {
            const el = document.getElementById('card-score-' + marketId);
            if (!el) return;
            try {
                const r = await fetch(API_BASE + '/market/' + marketId + '/live-score');
                const d = await r.json();
                if (d.error || (d.home_score === null && d.away_score === null)) {
                    el.textContent = d.status === 'pre_game' ? 'Game not started yet' : 'Score unavailable';
                    return;
                }
                const { status, home_team, away_team, home_score, away_score, period_label } = d;
                // Cache for resolved card display
                if (home_score !== null) scoreCache[marketId] = { home_team, away_team, home_score, away_score };
                const homeLead = (home_score ?? 0) > (away_score ?? 0);
                const awayLead = (away_score ?? 0) > (home_score ?? 0);
                const statusLine = status === 'completed'
                    ? '<span style="color:var(--yes-green);font-weight:bold;font-size:0.75rem;">✅ FINAL</span>'
                    : '<span style="color:var(--yes-green);font-weight:bold;font-size:0.75rem;">🟢 LIVE' + (period_label ? ' · ' + period_label : '') + '</span>';
                el.innerHTML =
                    '<div style="margin-bottom:5px;">' + statusLine + '</div>' +
                    '<div style="display:flex;justify-content:space-between;padding:3px 0;color:' + (homeLead ? '#fff' : '#aaa') + ';font-weight:' + (homeLead ? 'bold' : 'normal') + ';">' +
                        '<span>' + home_team + '</span><span style="font-family:monospace;color:' + (homeLead ? 'var(--yes-green)' : '#888') + ';">' + (home_score ?? '—') + '</span>' +
                    '</div>' +
                    '<div style="display:flex;justify-content:space-between;padding:3px 0;color:' + (awayLead ? '#fff' : '#aaa') + ';font-weight:' + (awayLead ? 'bold' : 'normal') + ';">' +
                        '<span>' + away_team + '</span><span style="font-family:monospace;color:' + (awayLead ? 'var(--yes-green)' : '#888') + ';">' + (away_score ?? '—') + '</span>' +
                    '</div>';
                // Game finished — trigger backend resolution
                if (status === 'completed') {
                    fetch(API_BASE + '/market/' + marketId + '/trigger-resolve', { method: 'POST' })
                        .catch(() => {});
                }
            } catch(e) {
                const el2 = document.getElementById('card-score-' + marketId);
                if (el2) el2.textContent = 'Score unavailable';
            }
        }

        async function openMarket(marketId) {
            try {
                const response = await fetch(`${API_BASE}/market/${marketId}`);
                currentMarket = await response.json();
                currentMarket.id = marketId;

                const modal = document.getElementById('bet-modal');
                const content = document.getElementById('modal-content');

                if (currentMarket.phase === 'sweat') {
                    const target = currentMarket.target_price || currentMarket.target_btc_price;
                    const direction = currentMarket.direction || 'up';
                    const isDown = direction === 'down';
                    // For stocks: sweat_start_price is Monday's open price (set at creation)
                    // Only clear if it looks like a bad BTC value (> 10000 for a stock)
                    if ((currentMarket.category||'bitcoin') === 'stocks') {
                        const sp = currentMarket.sweat_start_price;
                        const tgt = currentMarket.target_price;
                        // If start price is wildly out of range vs target, it's the old BTC bug
                        if (sp && tgt && (sp / tgt > 10 || sp / tgt < 0.1)) {
                            currentMarket.sweat_start_price = null;
                            currentMarket.highest_price_during_sweat = null;
                            currentMarket.lowest_price_during_sweat = null;
                        }
                    }
                    const extremeLabel = isDown ? 'Lowest Seen' : 'Highest Seen';
                    const extremeVal = isDown ? (currentMarket.lowest_price_during_sweat || null) : (currentMarket.highest_price_during_sweat || null);
                    // For sports: use betting_deadline+1hr (= tip-off) not the 90-day sweat_deadline
                    const _rawDeadlineTs = currentMarket.sweat_deadline
                        ? Math.floor(new Date(currentMarket.sweat_deadline.replace('Z','')+'Z').getTime()/1000)
                        : 0;
                    let sweatDeadlineTs = _rawDeadlineTs;
                    if ((currentMarket.category||'bitcoin') === 'sports') {
                        try {
                            // Use ESPN commence_time if cached, else betting_deadline+1hr as rough fallback
                            const ct = currentMarket._commence_time || '';
                            if (ct) {
                                sweatDeadlineTs = Math.floor(new Date(ct.replace('Z','')+'Z').getTime()/1000);
                            } else if (currentMarket.betting_deadline) {
                                sweatDeadlineTs = Math.floor(new Date(currentMarket.betting_deadline.replace('Z','')+'Z').getTime()/1000) + 3600;
                            }
                        } catch(e) {}
                    }

                    function calcPct(livePrice) {
                        if (!livePrice || !target) return 0;
                        if (isDown) {
                            // DROP: use highest seen as start → how far has price fallen toward target
                            const start = currentMarket.sweat_start_price
                                       || currentMarket.highest_price_during_sweat
                                       || livePrice;
                            const range = start - target;
                            if (range <= 0) return 0;
                            return Math.min(100, Math.max(0, ((start - livePrice) / range) * 100));
                        }
                        // PUMP: use lowest seen as start → how far has price risen toward target
                        const start = currentMarket.sweat_start_price
                                   || currentMarket.lowest_price_during_sweat
                                   || livePrice;
                        const range = target - start;
                        if (range <= 0) return livePrice >= target ? 100 : 0;
                        return Math.min(100, Math.max(0, ((livePrice - start) / range) * 100));
                    }

                    content.innerHTML = `
                        <h2 style="color: #f59e0b; margin-bottom: 20px;">${isDown ? '📉 SWEATING!' : '🔥 SWEATING!'}</h2>
                        <p style="color: #888; margin-bottom: 16px; font-size: 0.95rem;">${currentMarket.question}</p>
                        <div style="background: rgba(247,147,26,0.08); border: 1px solid rgba(247,147,26,0.3); border-radius: 8px; padding: 10px; margin-bottom: 16px; font-size: 0.85rem; color: #aaa; text-align: center;">
                            ${conditionText(currentMarket)}
                        </div>

                        ${                        ((currentMarket.category || 'bitcoin') === 'bitcoin' || (currentMarket.category) === 'stocks') ? `
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
                            <div style="background: #111; border: 1px solid #2a2a2a; border-radius: 10px; padding: 16px; text-align: center;">
                                <div style="color: #888; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">Target Price</div>
                                <div style="font-size: 1.4rem; font-weight: bold; color: var(--btc-orange);">$${target?.toLocaleString()}</div>
                                <div style="font-size: 0.7rem; color: #666; margin-top: 4px;">${isDown ? '▼ needs to DROP below' : '▲ needs to PUMP above'}</div>
                            </div>
                            <div style="background: #111; border: 1px solid #2a2a2a; border-radius: 10px; padding: 16px; text-align: center;">
                                <div style="color: #888; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">
                                    ${(currentMarket.category||'bitcoin')==='stocks' ? (currentMarket.ticker||'Stock') + ' Price' : 'Current BTC Price'}
                                </div>
                                <div id="sweat-modal-price" data-prev="${window.liveBtcPrice||''}" style="font-size: 1.4rem; font-weight: bold; color: white; transition: color 0.4s;">
                                    ${(currentMarket.category||'bitcoin')==='stocks' ? 'Loading...' : (window.liveBtcPrice ? '$' + window.liveBtcPrice.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2}) : 'Loading...')}
                                </div>
                            </div>
                        </div>

                        <div style="background: #111; border: 1px solid #2a2a2a; border-radius: 10px; padding: 16px; margin-bottom: 20px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <span style="color: #888; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px;">Progress to Target</span>
                                <span id="sweat-modal-pct" style="color: var(--btc-orange); font-size: 0.85rem; font-weight: bold;"></span>
                            </div>
                            <div style="background: #222; border-radius: 4px; height: 8px; overflow: hidden;">
                                <div id="sweat-modal-bar" style="height: 100%; background: linear-gradient(90deg, var(--btc-orange), ${isDown ? 'var(--no-red)' : 'var(--yes-green)'}); border-radius: 4px; transition: width 0.5s ease; width: 0%;"></div>
                            </div>
                            <div style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 0.72rem; color: #555;">
                                <span>${extremeLabel}: <span id="sweat-modal-extreme" data-val="${extremeVal||''}">${extremeVal ? '$'+Number(extremeVal).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—'}</span></span>

                        </div>`}
                        <div style="background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.3); border-radius: 10px; padding: 14px; text-align: center; margin-bottom: 16px;">
                            <div style="color: #888; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;" id="sweat-modal-timer-label">
                                ${(currentMarket.category||'bitcoin')==='stocks' ? 'Market closes in' : (currentMarket.category==='sports' ? '🏀 Tip-off in' : 'Game ends in')}

                        <div style="text-align: center; color: #555; font-size: 0.8rem;" id="sweat-modal-ends-line">
                            ${(currentMarket.category||'bitcoin') === 'sports' ? '' : 'Ends: ' + formatTime(currentMarket.sweat_deadline)}

                    `;

                    // Live update loop for sweat modal
                    if (window._sweatModalInterval) clearInterval(window._sweatModalInterval);
                    // For sports: compute tip-off time (betting_deadline + 1hr) to use as timer
                    let sportsTipoffTs = 0;
                    if ((currentMarket.category||'bitcoin') === 'sports') {
                        try {
                            // Use cached commence_time if available, else betting_deadline+1hr as fallback
                            const ct = currentMarket._commence_time || '';
                            if (ct) {
                                sportsTipoffTs = Math.floor(new Date(ct.replace('Z','')+'Z').getTime()/1000);
                            } else {
                                const bdl = currentMarket.betting_deadline || '';
                                sportsTipoffTs = Math.floor(new Date(bdl.replace('Z','')+'Z').getTime()/1000) + 3600;
                            }
                        } catch(e) {}
                    }

                    let sweatModalInterval = window._sweatModalInterval = setInterval(() => {
                        // Update countdown timer — skip if sports game clock has taken over
                        const timerEl = document.getElementById('sweat-modal-timer');
                        if (timerEl && timerEl.dataset.sportsOverride === 'true') return;
                        const nowSec = Math.floor(Date.now() / 1000);
                        // Sports pre-game: count down to tip-off, not 90-day deadline
                        // Re-check _commence_time in case it arrived after interval started
                        if ((currentMarket.category||'bitcoin') === 'sports' && currentMarket._commence_time) {
                            try { 
                                const newTs = Math.floor(new Date(currentMarket._commence_time.replace('Z','')+'Z').getTime()/1000);
                                if (newTs !== sportsTipoffTs) sportsTipoffTs = newTs;
                            } catch(e) {}
                        }
                        if ((currentMarket.category||'bitcoin') === 'sports' && sportsTipoffTs) {
                            if (nowSec < sportsTipoffTs) {
                                const left = sportsTipoffTs - nowSec;
                                timerEl.textContent = fmtCountdown(left);
                                timerEl.style.color = '#f59e0b';
                            } else {
                                // Past tip-off — game is live, override takes over from ESPN fetch
                                timerEl.dataset.sportsOverride = 'true';
                                const labelEl = document.getElementById('sweat-modal-timer-label');
                                if (labelEl) labelEl.textContent = '🏀 GAME IN PROGRESS';
                                timerEl.textContent = 'LIVE';
                                timerEl.style.color = 'var(--yes-green)';
                                timerEl.style.fontSize = '1.8rem';
                            }
                            return;
                        }
                        if (timerEl && sweatDeadlineTs) {
                            const left = sweatDeadlineTs - Math.floor(Date.now() / 1000);
                            timerEl.textContent = fmtCountdown(Math.max(0, left));
                            timerEl.style.color = left <= 60 ? 'var(--no-red)' : '#f59e0b';
                        }

                        // Price tracking only for bitcoin markets
                        const _cat = currentMarket.category || 'bitcoin';
                        if (_cat === 'sports') return;
                        if (_cat === 'stocks') return; // handled by fetchLiveStockPrice below

                        // Stop if modal was closed
                        if (!document.getElementById('sweat-modal-price')) {
                            clearInterval(sweatModalInterval);
                            return;
                        }

                        // Update live BTC price
                        const livePrice = window.liveBtcPrice;
                        const priceEl = document.getElementById('sweat-modal-price');
                        if (livePrice && priceEl) {
                            const formatted = '$' + livePrice.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2});
                            if (priceEl.textContent !== formatted) {
                                const prev = parseFloat(priceEl.dataset.prev || livePrice);
                                priceEl.style.color = livePrice > prev ? 'var(--yes-green)' : livePrice < prev ? 'var(--no-red)' : 'white';
                                setTimeout(() => { if (priceEl) priceEl.style.color = 'white'; }, 500);
                                priceEl.textContent = formatted;
                                priceEl.dataset.prev = livePrice;

                                // Update extreme tracker (highest for up, lowest for down)
                                const extremeEl = document.getElementById('sweat-modal-extreme');
                                if (extremeEl) {
                                    const cur = parseFloat(extremeEl.dataset.val) || (isDown ? Infinity : 0);
                                    const newExtreme = isDown ? (livePrice < cur) : (livePrice > cur);
                                    if (newExtreme || !extremeEl.dataset.val) {
                                        extremeEl.dataset.val = livePrice;
                                        extremeEl.textContent = '$' + livePrice.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2});
                                    }
                                }

                                // Update progress bar
                                const pct = calcPct(livePrice);
                                const barEl = document.getElementById('sweat-modal-bar');
                                const pctEl = document.getElementById('sweat-modal-pct');
                                if (barEl) barEl.style.width = pct.toFixed(1) + '%';
                                if (pctEl) pctEl.textContent = pct.toFixed(1) + '% of target';
                            }
                        }

                        // (countdown updated at top of interval for all categories)
                    }, 1000);

                // ── Live price polling for stocks markets ─────────────────────────
                if ((currentMarket.category || 'bitcoin') === 'stocks') {
                    async function fetchLiveStockPrice() {
                        const priceEl = document.getElementById('sweat-modal-price');

                                if (d.highest_price_during_sweat != null)
                                    currentMarket.highest_price_during_sweat = d.highest_price_during_sweat;
                                if (d.lowest_price_during_sweat != null)
                                    currentMarket.lowest_price_during_sweat = d.lowest_price_during_sweat;
                                // Fallback: seed from live price if backend hasn't tracked yet
                                if (currentMarket.highest_price_during_sweat == null)
                                    currentMarket.highest_price_during_sweat = livePrice;
                                if (currentMarket.lowest_price_during_sweat == null)
                                    currentMarket.lowest_price_during_sweat = livePrice;
                                const extremeEl = document.getElementById('sweat-modal-extreme');
                                if (extremeEl) {
                                    const cur = parseFloat(extremeEl.dataset.val) || (isDown ? Infinity : 0);
                                    if (isDown ? livePrice < cur : livePrice > cur) {
                                        extremeEl.dataset.val = livePrice;
                                        currentMarket.lowest_price_during_sweat = livePrice;
                                        extremeEl.textContent = '$' + livePrice.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2});

                                        extremeEl.dataset.val = livePrice;
                                        currentMarket.highest_price_during_sweat = livePrice;
                                        extremeEl.textContent = '$' + livePrice.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2});

                                const pct = calcPct(livePrice);
                                const barEl = document.getElementById('sweat-modal-bar');
                                const pctEl = document.getElementById('sweat-modal-pct');
                                if (barEl) barEl.style.width = pct.toFixed(1) + '%';
                                if (pctEl) pctEl.textContent = pct.toFixed(1) + '% of target';
                            }

                    }
                    fetchLiveStockPrice();

                        if (!document.getElementById('sweat-modal-price')) { clearInterval(stockPriceInterval); return; }

                // ── Live score polling for sports markets ──────────────────────────
                if ((currentMarket.category || 'bitcoin') === 'sports') {

                                    ? Math.floor(new Date(commence_time.replace('Z','')+'Z').getTime()/1000) : 0;

                                if (status === 'completed' || (sweatDeadlineMs && nowMs > sweatDeadlineMs)) {

                                        </div>`;
                                }
                            } else {
                                // Live or final scoreboard
                                const homeLead   = (home_score ?? 0) > (away_score ?? 0);
                                const awayLead   = (away_score ?? 0) > (home_score ?? 0);
                                const { period_label } = d;
                                const statusBadge = status === 'completed'
                                    ? '<span style="color:var(--yes-green);font-size:0.72rem;font-weight:bold;text-transform:uppercase;letter-spacing:0.5px;">✅ FINAL</span>'
                                    : `<span style="display:inline-flex;align-items:center;gap:5px;color:var(--yes-green);font-size:0.72rem;font-weight:bold;text-transform:uppercase;letter-spacing:0.5px;"><span style="width:7px;height:7px;border-radius:50%;background:var(--yes-green);display:inline-block;animation:pulse 1.5s infinite;"></span>LIVE${period_label ? ' &nbsp;·&nbsp; ' + period_label : ''}</span>`;

                                const teamRow = (name, score, leading) =>
                                    `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:${leading ? 'rgba(34,197,94,0.08)' : 'transparent'};border-radius:8px;margin-bottom:4px;">
                                        <span style="font-size:0.95rem;font-weight:${leading ? '700' : '400'};color:${leading ? '#fff' : '#aaa'};">${name}</span>
                                        <span style="font-family:monospace;font-size:1.6rem;font-weight:bold;color:${leading ? 'var(--yes-green)' : '#888'};">${score ?? '—'}</span>
                                    </div>`;

                                panel.innerHTML = `
                                    <div style="text-align:center;margin-bottom:10px;">${statusBadge}</div>

                                        YES = ${home_team} wins &nbsp;·&nbsp; NO = ${away_team} wins

                                // Replace countdown timer with ESPN game clock when live

                                        ? Math.floor(new Date(d.commence_time.replace('Z','')+'Z').getTime()/1000) : 0;

                                    const leftToTipoff = startTs ? Math.max(0, startTs - nowSec2) : 0;

                            if (p) p.innerHTML = '<div style="text-align:center;color:#555;font-size:0.85rem;">Score unavailable</div>';

                    fetchLiveScore();  // immediate first load
                    if (window._scoreInterval) clearInterval(window._scoreInterval);
                    window._scoreInterval = setInterval(() => {
                        if (!document.getElementById('score-panel')) { clearInterval(window._scoreInterval); window._scoreInterval = null; return; }
                        fetchLiveScore();

                }

        async function placeBet(side) {
            const amount = parseInt(document.getElementById('bet-amount').value);
            if (!amount || amount < 100) {
                alert('Minimum bet is 100 sats');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/market/${currentMarket.id}/create-position`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ side: side, amount_sats: amount })
                });

                currentTicketData = await response.json();
                if (currentTicketData.error) {
                    alert(currentTicketData.error);
                    return;
                }

                displayInvoice(currentTicketData);
            } catch (error) {
                console.error('Failed to create position:', error);
                alert('Failed to create bet');
            }
        }
