                width: 240,
                height: 240,
                colorDark: '#000000',
                colorLight: '#ffffff'
            });

            startPaymentCheck(data.ticket_number, currentMarket.id);
        }

        function copyInvoice() {
            const input = document.getElementById('invoice-text');
            input.select();
            document.execCommand('copy');
            alert('Invoice copied to clipboard!');
        }

        function startPaymentCheck(ticketNumber, marketId) {
            if (checkInterval) clearInterval(checkInterval);
            checkInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE}/market/${marketId}/confirm-position/${ticketNumber}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    const data = await response.json();
                    if (data.status === 'confirmed' || data.status === 'already_confirmed') {
                        clearInterval(checkInterval);
                        checkInterval = null;
                        showPaymentSuccess({
                            ticket_number: ticketNumber,
                            side: currentTicketData.side,
                            amount_sats: currentTicketData.amount,
                            signature: currentTicketData.signature
                        });
                    }
                } catch (error) {
                    console.error('Payment check failed:', error);
                }
            }, 3000);
        }

        function showPaymentSuccess(data) {
            const content = document.getElementById('modal-content');
            const sideColor = data.side === 'YES' ? 'var(--yes-green)' : 'var(--no-red)';
            content.innerHTML = `
                <div style="text-align: center; margin-bottom: 24px;">
                    <div style="font-size: 3rem; margin-bottom: 8px;">✅</div>
                    <h2 style="color: var(--yes-green); font-size: 1.8rem;">Payment Confirmed!</h2>
                </div>

                <div style="text-align: center; margin-bottom: 24px; padding: 20px; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.3); border-radius: 12px;">
                    <p style="color: #888; font-size: 0.85rem; margin-bottom: 6px;">Your Position</p>
                    <div style="font-size: 2rem; font-weight: bold; color: ${sideColor};">${data.amount_sats.toLocaleString()} sats on ${data.side}</div>
                </div>

                <div style="padding: 20px; background: linear-gradient(135deg, #1a1a1a, #222); border: 2px solid var(--btc-orange); border-radius: 12px; margin-bottom: 16px;">
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
                        <span style="font-size: 1.1rem;">⚠️</span>
                        <span style="color: var(--btc-orange); font-weight: bold;">Save These — You'll need them to claim winnings</span>
                    </div>

                    <div style="margin-bottom: 14px;">
                        <p style="color: #888; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">Ticket Number</p>
                        <div style="font-family: monospace; font-size: 1.3rem; font-weight: bold; padding: 10px 14px; background: #111; border-radius: 6px; letter-spacing: 2px;">${data.ticket_number}</div>
                    </div>

                    <div>
                        <p style="color: #888; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">Claim Key</p>
                        <div style="font-family: monospace; font-size: 0.8rem; word-break: break-all; padding: 10px 14px; background: #111; border-radius: 6px; color: var(--btc-orange);">${data.signature}</div>
                    </div>
                </div>

                <button id="copy-all-btn" onclick="copyAllDetails('${data.amount_sats}', '${data.side}', '${data.ticket_number}', '${data.signature}')" style="width: 100%; padding: 15px; background: #2a2a2a; border: 2px solid var(--btc-orange); color: var(--btc-orange); border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 12px; transition: all 0.2s;">
                    📋 Copy All Details to Clipboard
                </button>

                <button onclick="closeModal(); loadMarkets();" style="width: 100%; padding: 15px; background: var(--btc-orange); color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer;">
                    Done
                </button>
            `;
        }

        function copyAllDetails(amount, side, ticketNumber, signature) {
            const text = `=== Satoshi's Market — Bet Receipt ===\nPosition: ${amount} sats on ${side}\nTicket Number: ${ticketNumber}\nClaim Key: ${signature}\n======================================`;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-all-btn');
                btn.textContent = '✅ Copied!';
                btn.style.background = 'rgba(34,197,94,0.15)';
                btn.style.borderColor = 'var(--yes-green)';
                btn.style.color = 'var(--yes-green)';
                setTimeout(() => {
                    btn.textContent = '📋 Copy All Details to Clipboard';
                    btn.style.background = '#2a2a2a';
                    btn.style.borderColor = 'var(--btc-orange)';
                    btn.style.color = 'var(--btc-orange)';
                }, 2500);
            }).catch(() => {
                // Fallback for older browsers
                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                const btn = document.getElementById('copy-all-btn');
                btn.textContent = '✅ Copied!';
                setTimeout(() => { btn.textContent = '📋 Copy All Details to Clipboard'; }, 2500);
            });
        }

        async function claimWinnings() {
            const ticketNumber = document.getElementById('claim-ticket-number').value.trim();
            const signature = document.getElementById('claim-signature').value.trim();
            const lightningAddress = document.getElementById('claim-lightning-address').value.trim();

            if (!ticketNumber || !signature || !lightningAddress) {
                alert('Please fill in all fields');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/claim-winnings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticket_number: ticketNumber, signature: signature, lightning_address: lightningAddress })
                });

                const data = await response.json();
                if (data.error) {
                    alert('Error: ' + data.error);
                } else {
                    alert(`Success! ${data.payout} sats sent to ${lightningAddress}`);
                    document.getElementById('claim-ticket-number').value = '';
                    document.getElementById('claim-signature').value = '';
                    document.getElementById('claim-lightning-address').value = '';
                    loadMarkets();
                }
            } catch (error) {
                console.error('Claim failed:', error);
                alert('Failed to claim winnings');
            }
        }

        function closeModal() {
            document.getElementById('bet-modal').style.display = 'none';
            if (window._sweatModalInterval) { clearInterval(window._sweatModalInterval); window._sweatModalInterval = null; }
            if (window._scoreInterval) { clearInterval(window._scoreInterval); window._scoreInterval = null; }
            if (checkInterval) {
                clearInterval(checkInterval);
                checkInterval = null;
            }
        }

        loadMarkets();
        // Stagger polling with random jitter so multiple users don't hammer the server simultaneously
        setTimeout(() => { setInterval(loadMarkets, 45000); }, Math.random() * 20000);

        // ============================================
        // BTC LIVE PRICE TICKER
        // Strategy: Try Coinbase WebSocket first (port 443, browser-friendly)
        //           Fall back to CoinGecko REST polling if WS fails within 5s
        // ============================================
        (function startTicker() {
            const priceEl  = document.getElementById('ticker-price');
            const changeEl = document.getElementById('ticker-change');
            const dotEl    = document.getElementById('ticker-dot');
            const statusEl = document.getElementById('ticker-status-text');

            let lastPrice     = null;
            let openPrice     = null;
            let ws            = null;
            let usingFallback = false;
            let fallbackTimer = null;
            let wsConnected   = false;

            function setStatus(live, label) {
                dotEl.className      = 'ticker-dot' + (live ? ' live' : '');
                statusEl.textContent = label || (live ? 'Live' : 'Reconnecting...');
            }

            function formatPrice(p) {
                return '$' + Number(p).toLocaleString('en-US', {
                    minimumFractionDigits: 2, maximumFractionDigits: 2
                });
            }

            function updateDisplay(price) {
                if (!openPrice) return;
                const diff  = price - openPrice;
                const pct   = (diff / openPrice) * 100;
                const dir   = diff >= 0 ? 'up' : 'down';
                const arrow = diff >= 0 ? '▲' : '▼';

                if (lastPrice !== null && price !== lastPrice) {
                    priceEl.className = 'ticker-price ' + (price > lastPrice ? 'up' : 'down');
                    setTimeout(() => { priceEl.className = 'ticker-price'; }, 600);
                }

                priceEl.textContent    = formatPrice(price);
                changeEl.style.display = '';
                changeEl.className     = 'ticker-change ' + dir;
                changeEl.textContent   = `${arrow} ${Math.abs(pct).toFixed(2)}% (${diff >= 0 ? '+' : ''}${formatPrice(diff)})`;
                lastPrice = price;
                window.liveBtcPrice = price;
            }

            // Fetch 24h open price from Coinbase stats
            async function fetchOpenPrice() {
                try {
                    const r = await fetch('https://api.exchange.coinbase.com/products/BTC-USD/stats');
                    const d = await r.json();
                    openPrice = parseFloat(d.open);
                } catch(e) {
                    console.log('[Ticker] Could not fetch open price:', e);
                }
            }

            // --- REST POLLING FALLBACK (CoinGecko) ---
            let pollInterval = null;
            async function pollCoinGecko() {
                try {
                    const r = await fetch(
                        'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true',
                        { cache: 'no-store' }
                    );
                    const d = await r.json();
                    const price  = d.bitcoin.usd;
                    const change = d.bitcoin.usd_24h_change;
                    if (!openPrice) openPrice = price / (1 + change / 100);
                    updateDisplay(price);
                    window.liveBtcPrice = price;
                    setStatus(true, 'Live (polling)');
                } catch(e) {
                    setStatus(false, 'No feed');
                }
            }

            function startFallback() {
                if (usingFallback) return;
                usingFallback = true;
                if (ws) { try { ws.close(); } catch(e){} ws = null; }
                console.log('[Ticker] WebSocket failed, switching to REST polling');
                pollCoinGecko();
                pollInterval = setInterval(pollCoinGecko, 15000);
            }

            // --- COINBASE WEBSOCKET ---
            function connectWS() {
                if (usingFallback) return;
                wsConnected = false;

                fallbackTimer = setTimeout(() => {
                    if (!wsConnected) {
                        console.log('[Ticker] WS timeout, switching to REST');
                        startFallback();
                    }
                }, 5000);

                try {
                    ws = new WebSocket('wss://advanced-trade-ws.coinbase.com');

                    ws.onopen = () => {
                        ws.send(JSON.stringify({
                            type: 'subscribe',
                            product_ids: ['BTC-USD'],
                            channel: 'ticker'
                        }));
                    };

                    ws.onmessage = (e) => {
                        try {
                            const msg = JSON.parse(e.data);
                            const events = msg.events || [];
                            for (const ev of events) {
                                const tickers = ev.tickers || [];
                                for (const t of tickers) {
                                    if (t.product_id !== 'BTC-USD') continue;
                                    const price = parseFloat(t.price);
                                    if (!price) continue;
                                    wsConnected = true;
                                    clearTimeout(fallbackTimer);
                                    updateDisplay(price);
                                    setStatus(true, 'Live');
                                }
                            }
                        } catch(err) {}
                    };

                    ws.onerror = () => { if (!wsConnected) startFallback(); };

                    ws.onclose = () => {
                        if (!usingFallback && wsConnected) {
                            setStatus(false);
                            setTimeout(connectWS, 5000);
                        } else if (!usingFallback) {
                            startFallback();
                        }
                    };

                } catch(e) {
                    startFallback();
                }
            }

            fetchOpenPrice().then(connectWS);
        })();
        // ============================================
        // END TICKER
        // ============================================
        // ============================================
        // END TICKER
        // ============================================
    </script>
</body>
</html>
