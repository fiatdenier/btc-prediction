<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Bitcoin Prediction Markets</title>
    <style>
        :root {
            --btc-orange: #f7931a;
            --dark-bg: #1a1a1a;
            --card-bg: #2a2a2a;
            --yes-green: #22c55e;
            --no-red: #ef4444;
            --border-color: #404040;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--dark-bg);
            color: white;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 2px solid var(--btc-orange);
            margin-bottom: 30px;
        }

        h1 { color: var(--btc-orange); font-size: 2rem; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
        }

        .stat-card h3 {
            color: #888;
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--btc-orange);
        }

        .section {
            background: var(--card-bg);
            border: 2px solid var(--btc-orange);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .section h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .action-btn {
            background: var(--btc-orange);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 10px;
        }

        .action-btn:hover { background: #e08216; transform: translateY(-2px); }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-danger { background: var(--no-red); }
        .btn-danger:hover { background: #dc2626; }

        .btn-success { background: var(--yes-green); }
        .btn-success:hover { background: #16a34a; }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            margin-bottom: 15px;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--btc-orange);
        }

        label {
            display: block;
            color: #888;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .datetime-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .alert-success { background: rgba(34, 197, 94, 0.2); border: 1px solid var(--yes-green); }
        .alert-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--no-red); }
        .alert-info { background: rgba(59, 130, 246, 0.2); border: 1px solid #3b82f6; }

        .markets-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .market-item {
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .market-item h4 {
            margin-bottom: 10px;
        }

        .market-item .meta {
            color: #888;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-left: 10px;
        }

        .status-open { background: rgba(34, 197, 94, 0.2); color: var(--yes-green); }
        .status-closed { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .status-resolved { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔐 Admin Dashboard</h1>
            <div id="login-status"></div>
        </header>

        <div id="login-section">
            <div class="section">
                <h2>Admin Login</h2>
                <input type="password" id="admin-password" placeholder="Enter admin password">
                <button class="action-btn" onclick="login()">Login</button>
                <div id="login-error"></div>
            </div>
        </div>

        <div id="dashboard" style="display: none;">
            
            <!-- Create New Market -->
            <div class="section">
                <h2>➕ Create New Market</h2>
                
                <div class="form-group">
                    <label>Question</label>
                    <textarea id="new-question" rows="2" placeholder="Will Bitcoin hit $150,000 by June 30, 2026?"></textarea>
                </div>

                <div class="datetime-group">
                    <div class="form-group">
                        <label>Deadline Date</label>
                        <input type="date" id="new-date">
                    </div>
                    <div class="form-group">
                        <label>Deadline Time</label>
                        <input type="time" id="new-time" value="23:59">
                    </div>
                </div>

                <div class="form-group">
                    <label>House Rake (%)</label>
                    <input type="number" id="new-rake" value="5" min="0" max="100" step="0.1">
                </div>

                <button class="action-btn btn-success" onclick="createMarket()">
                    🚀 CREATE MARKET
                </button>

                <div id="create-result"></div>
            </div>

            <!-- Active Markets -->
            <div class="section">
                <h2>📊 All Markets</h2>
                <div id="markets-list" class="markets-list">
                    <div style="text-align: center; color: #888; padding: 20px;">Loading...</div>
                </div>
            </div>

            <!-- Market Actions -->
            <div class="section">
                <h2>⚙️ Market Actions</h2>
                
                <label>Select Market</label>
                <select id="action-market-select">
                    <option value="">Choose a market...</option>
                </select>

                <div style="margin-top: 20px;">
                    <button class="action-btn btn-danger" onclick="closeMarket()">
                        🔒 CLOSE BETTING
                    </button>
                    <p style="color: #888; margin-top: 10px; font-size: 0.9rem;">
                        Prevent new bets but keep market open
                    </p>
                </div>

                <div style="margin-top: 30px;">
                    <h3 style="margin-bottom: 15px;">Resolve Market</h3>
                    <select id="outcome-select">
                        <option value="">Select Outcome</option>
                        <option value="YES">YES</option>
                        <option value="NO">NO</option>
                    </select>
                    <button class="action-btn btn-success" onclick="resolveMarket()">
                        ✓ RESOLVE MARKET
                    </button>
                    <div id="resolution-result"></div>
                </div>
            </div>

            <button class="action-btn" onclick="loadMarkets()">
                🔄 REFRESH
            </button>
        </div>
    </div>

    <script>
        const API_BASE = 'https://predict.fiatdenier.com';
        let adminKey = '';
        let allMarkets = [];

        function login() {
            adminKey = document.getElementById('admin-password').value;
            
            loadMarkets().then(success => {
                if (success) {
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    document.getElementById('login-status').innerHTML = 
                        '<span style="color: var(--yes-green);">✓ Logged in</span>';
                    setDefaultDate();
                } else {
                    document.getElementById('login-error').innerHTML = 
                        '<div class="alert alert-danger">Invalid password</div>';
                    adminKey = '';
                }
            });
        }

        function setDefaultDate() {
            // Set default to 30 days from now
            const date = new Date();
            date.setDate(date.getDate() + 30);
            const dateStr = date.toISOString().split('T')[0];
            document.getElementById('new-date').value = dateStr;
        }

        async function createMarket() {
            const question = document.getElementById('new-question').value.trim();
            const date = document.getElementById('new-date').value;
            const time = document.getElementById('new-time').value;
            const rake = parseFloat(document.getElementById('new-rake').value);

            if (!question) {
                alert('Please enter a question');
                return;
            }

            if (!date) {
                alert('Please select a deadline date');
                return;
            }

            // Combine date and time into ISO format
            const deadline = `${date}T${time}:00`;

            const resultDiv = document.getElementById('create-result');
            resultDiv.innerHTML = '<div style="color: #888;">Creating market...</div>';

            try {
                const response = await fetch(`${API_BASE}/admin/create-market?key=${adminKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        deadline: deadline,
                        house_rake: rake
                    })
                });

                const data = await response.json();

                if (data.error) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-danger">
                            <strong>❌ Error:</strong> ${data.error}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            <strong>✅ ${data.status}</strong><br>
                            Market ID: ${data.market_id}<br>
                            Question: ${data.market.question}<br>
                            Deadline: ${new Date(data.market.deadline).toLocaleString()}
                        </div>
                    `;

                    // Clear form
                    document.getElementById('new-question').value = '';
                    setDefaultDate();
                    document.getElementById('new-rake').value = '5';

                    // Reload markets
                    setTimeout(() => loadMarkets(), 1000);
                }
            } catch (error) {
                console.error('Create market failed:', error);
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <strong>❌ Error:</strong> Failed to create market
                    </div>
                `;
            }
        }

        async function loadMarkets() {
            try {
                const response = await fetch(`${API_BASE}/markets`);
                
                if (response.status === 403) {
                    return false;
                }

                const data = await response.json();
                allMarkets = [...(data.active || []), ...(data.resolved || [])];

                displayMarketsList(allMarkets);
                populateMarketSelect(allMarkets);

                return true;
            } catch (error) {
                console.error('Failed to load markets:', error);
                return false;
            }
        }

        function displayMarketsList(markets) {
            const container = document.getElementById('markets-list');

            if (!markets || markets.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">No markets found</div>';
                return;
            }

            container.innerHTML = markets.map(market => `
                <div class="market-item">
                    <h4>
                        ${market.question}
                        <span class="status-badge status-${market.status}">${market.status}</span>
                    </h4>
                    <div class="meta">
                        ID: ${market.id} | 
                        Pool: ${market.total_pool.toLocaleString()} sats | 
                        YES: ${market.yes_percentage}% | 
                        NO: ${market.no_percentage}% | 
                        Deadline: ${new Date(market.deadline).toLocaleDateString()}
                    </div>
                </div>
            `).join('');
        }

        function populateMarketSelect(markets) {
            const select = document.getElementById('action-market-select');
            
            select.innerHTML = '<option value="">Choose a market...</option>' +
                markets.filter(m => m.status !== 'resolved').map(market => `
                    <option value="${market.id}">${market.question.substring(0, 60)}... [${market.status}]</option>
                `).join('');
        }

        async function closeMarket() {
            const marketId = document.getElementById('action-market-select').value;

            if (!marketId) {
                alert('Please select a market');
                return;
            }

            if (!confirm('Close betting for this market?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/admin/market/${marketId}/close?key=${adminKey}`, {
                    method: 'POST'
                });

                const data = await response.json();
                alert(data.status || 'Market closed');
                loadMarkets();
            } catch (error) {
                alert('Failed to close market');
            }
        }

        async function resolveMarket() {
            const marketId = document.getElementById('action-market-select').value;
            const outcome = document.getElementById('outcome-select').value;

            if (!marketId) {
                alert('Please select a market');
                return;
            }

            if (!outcome) {
                alert('Please select an outcome');
                return;
            }

            if (!confirm(`Resolve market with outcome: ${outcome}?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/admin/market/${marketId}/resolve?key=${adminKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ outcome: outcome })
                });

                const data = await response.json();

                document.getElementById('resolution-result').innerHTML = `
                    <div class="alert alert-success">
                        <strong>${data.status}</strong><br>
                        Outcome: ${data.outcome}<br>
                        Winners: ${data.winners}<br>
                        Total Payouts: ${data.total_payouts || 0} sats<br>
                        House Earnings: ${data.house_earnings || 0} sats
                    </div>
                `;

                loadMarkets();
            } catch (error) {
                alert('Failed to resolve market');
            }
        }
    </script>
</body>
</html>
