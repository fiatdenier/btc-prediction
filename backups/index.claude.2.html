<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satoshi's Market - Bitcoin Prediction Markets</title>
    <style>
        :root {
            --btc-orange: #f7931a;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --yes-green: #22c55e;
            --no-red: #ef4444;
            --border-color: #2a2a2a;
            --resolved-green: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--dark-bg);
            color: white;
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            padding: 20px 0 40px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            color: var(--btc-orange);
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .subtitle { 
            color: #888; 
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .markets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .market-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .market-card:hover {
            border-color: var(--btc-orange);
            transform: translateY(-2px);
        }

        .market-card.resolved {
            border-color: var(--resolved-green);
            background: linear-gradient(135deg, #1a1a1a 0%, #1a2a1a 100%);
        }

        .market-card.resolved:hover {
            border-color: var(--resolved-green);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }

        .market-question {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
            min-height: 60px;
        }

        .market-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .stat { text-align: center; }

        .stat-label {
            color: #888;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .stat-value { font-size: 1.5rem; font-weight: bold; }
        .yes-value { color: var(--yes-green); }
        .no-value { color: var(--no-red); }

        .market-pool {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .market-pool strong { color: var(--btc-orange); }

        .countdown {
            background: rgba(247, 147, 26, 0.1);
            border: 1px solid var(--btc-orange);
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            text-align: center;
        }

        .countdown-label {
            color: #888;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .countdown-time {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--btc-orange);
        }

        .countdown-units {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-top: 5px;
        }

        .countdown-unit {
            text-align: center;
        }

        .countdown-unit .number {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--btc-orange);
            display: block;
        }

        .countdown-unit .label {
            font-size: 0.65rem;
            color: #888;
            text-transform: uppercase;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .status-open { background: rgba(34, 197, 94, 0.2); color: var(--yes-green); }
        .status-closed { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .status-resolved { 
            background: rgba(34, 197, 94, 0.3); 
            color: var(--resolved-green);
            border: 1px solid var(--resolved-green);
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ccc;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #888;
            font-size: 1.1rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--btc-orange);
            border-radius: 16px;
            width: 100%;
            max-width: 760px;
            margin: 40px auto;
            padding: 40px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: #888;
            background: none;
            border: none;
        }

        .close-modal:hover { color: white; }

        .action-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-yes { background: var(--yes-green); color: white; }
        .btn-yes:hover { background: #16a34a; }
        .btn-no { background: var(--no-red); color: white; }
        .btn-no:hover { background: #dc2626; }

        input {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        input:focus {
            outline: none;
            border-color: var(--btc-orange);
        }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .quick-amt-btn {
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .quick-amt-btn:hover {
            background: #3a3a3a;
            border-color: var(--btc-orange);
        }

        .claim-section {
            background: var(--card-bg);
            border: 2px solid var(--yes-green);
            border-radius: 12px;
            padding: 30px;
            margin-top: 40px;
        }

        .ticket-display {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 2px solid var(--btc-orange);
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>⚡ Satoshi's Market</h1>
                    <div class="subtitle">Predict the Future. Win Sats. Powered by Lightning Network ⚡</div>
                </div>
                <div style="text-align: right;">
                    <label style="color: #888; font-size: 0.9rem; cursor: pointer;">
                        <input type="checkbox" id="timezone-toggle" style="margin-right: 8px;">
                        Show times in EST (default: UTC)
                    </label>
                </div>
            </div>
        </header>

        <h2 class="section-title">🔥 Active Markets</h2>
        <div id="active-markets" class="markets-grid">
            <div class="loading">Loading markets...</div>
        </div>

        <div id="resolved-section" style="display: none; margin-top: 60px;">
            <h2 class="section-title">✅ Recently Resolved</h2>
            <div id="resolved-markets" class="markets-grid"></div>
        </div>

        <!-- Claim Winnings Section -->
        <div id="claim-section" class="claim-section" style="display: none;">
            <h2 style="margin-top: 0;">💰 Claim Your Winnings</h2>
            
            <p style="color: #888; margin-bottom: 20px;">
                If you have a winning ticket, enter your details below to claim your payout.
            </p>

            <input type="text" id="claim-ticket-number" placeholder="Ticket Number (e.g., ABC123XY)">
            <input type="text" id="claim-signature" placeholder="Claim Key (your secret signature)" style="font-family: monospace;">
            <input type="text" id="claim-lightning-address" placeholder="Lightning Address (you@getalby.com) or Invoice">

            <button class="action-btn btn-yes" onclick="claimWinnings()">
                💸 CLAIM WINNINGS
            </button>

            <div id="claim-status" style="margin-top: 20px;"></div>
        </div>
    </div>

    <!-- Bet Modal -->
    <div id="bet-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <script>
        const API_BASE = 'https://predict.fiatdenier.com/api';
        let currentMarket = null;
        let currentTicketData = null;
        let checkInterval = null;

        async function loadMarkets() {
            try {
                const response = await fetch(`${API_BASE}/markets`);
                const data = await response.json();
                displayMarkets(data.active, 'active-markets');
                if (data.resolved && data.resolved.length > 0) {
                    displayMarkets(data.resolved, 'resolved-markets');
                    document.getElementById('claim-section').style.display = 'block';
                }
            } catch (error) {
                console.error('Failed to load markets:', error);
                document.getElementById('active-markets').innerHTML = '<div class="loading">Failed to load markets</div>';
            }
        }

        function displayMarkets(markets, containerId) {
            const container = document.getElementById(containerId);
            if (!markets || markets.length === 0) {
                container.innerHTML = '<div class="loading">No markets available</div>';
                return;
            }

            container.innerHTML = markets.map(market => {
                const isResolved = market.status === 'resolved';
                const resolvedClass = isResolved ? 'resolved' : '';
                
                return `
                    <div class="market-card ${resolvedClass}" onclick="openMarket('${market.id}')">
                        <div class="status-badge status-${market.status}">${market.status}</div>
                        <div class="market-question">${market.question}</div>
                        
                        <div class="market-stats">
                            <div class="stat">
                                <div class="stat-label">YES</div>
                                <div class="stat-value yes-value">${market.yes_percentage}%</div>
                            </div>
                            <div class="stat">
                                <div class="stat-label">NO</div>
                                <div class="stat-value no-value">${market.no_percentage}%</div>
                            </div>
                        </div>

                        <div class="market-pool">
                            Total Pool: <strong>${market.total_pool.toLocaleString()} sats</strong>
                        </div>

                        ${market.phase === 'betting' ? `
                            <div style="padding: 15px; text-align: center; border-radius: 8px; background: rgba(34, 197, 94, 0.2); margin-top: 10px;">
                                <div style="color: #22c55e; font-weight: bold; font-size: 1.1rem; margin-bottom: 5px;">
                                    ⏰ BETTING OPEN
                                </div>
                                <div style="color: #888; font-size: 0.85rem;">
                                    Betting close: ${new Date(market.betting_deadline?.replace('Z', '') || market.deadline).toUTCString()}<br>
                                    ${market.sweat_deadline ? `Game ends: ${new Date(market.sweat_deadline.replace('Z', '')).toUTCString()}` : ''}
                                </div>
                            </div>
                        ` : market.phase === 'sweat' ? `
                            <div style="padding: 15px; text-align: center; border-radius: 8px; background: rgba(245, 158, 11, 0.2); margin-top: 10px;">
                                <div style="color: #f59e0b; font-weight: bold; font-size: 1.1rem; margin-bottom: 8px;">
                                    🔥 SWEATING!
                                </div>
                                <div style="color: #fff; font-size: 1rem; margin-bottom: 5px;">
                                    Target: <strong>$${market.target_btc_price?.toLocaleString()}</strong>
                                </div>
                                <div style="color: #888; font-size: 0.85rem;">
                                    ${market.highest_price_during_sweat ? `Highest: $${market.highest_price_during_sweat.toLocaleString()}<br>` : ''}
                                    Ends: ${new Date(market.sweat_deadline?.replace('Z', '') || market.deadline).toUTCString()}
                                </div>
                            </div>
                        ` : `
                            <div style="text-align: center; margin-top: 10px; padding: 10px; background: rgba(34, 197, 94, 0.1); border-radius: 8px;">
                                <div style="color: var(--resolved-green); font-weight: bold; font-size: 1.1rem;">
                                    ✅ ${market.outcome} Won
                                </div>
                            </div>
                        `}
                    </div>
                `;
            }).join('');

            const hasSweatMarkets = markets.some(m => m.phase === 'sweat');
            if (hasSweatMarkets) {
                setTimeout(() => loadMarkets(), 15000);
            }
        }

        async function openMarket(marketId) {
            try {
                const response = await fetch(`${API_BASE}/market/${marketId}`);
                currentMarket = await response.json();
                currentMarket.id = marketId;

                const modal = document.getElementById('bet-modal');
                const content = document.getElementById('modal-content');

                if (currentMarket.phase !== 'betting') {
                    content.innerHTML = `
                        <h2>${currentMarket.question}</h2>
                        <div style="text-align: center; padding: 40px; color: #888;">
                            <p>This market is ${currentMarket.phase === 'sweat' ? '🔥 sweating' : currentMarket.phase}.</p>
                            ${currentMarket.outcome ? `<p style="margin-top: 20px; font-size: 1.5rem;">Outcome: <strong style="color: var(--btc-orange);">${currentMarket.outcome}</strong></p>` : ''}
                        </div>
                    `;
                } else {
                    content.innerHTML = `
                        <h2 style="margin-bottom: 20px;">${currentMarket.question}</h2>

                        <div class="market-stats" style="margin-bottom: 30px;">
                            <div class="stat">
                                <div class="stat-label">YES</div>
                                <div class="stat-value yes-value">${currentMarket.yes_percentage}%</div>
                            </div>
                            <div class="stat">
                                <div class="stat-label">NO</div>
                                <div class="stat-value no-value">${currentMarket.no_percentage}%</div>
                            </div>
                        </div>

                        <div style="text-align: center; margin-bottom: 20px; color: #888;">
                            <strong>Total Pool:</strong> ${currentMarket.total_pool.toLocaleString()} sats
                        </div>

                        <div style="margin-bottom: 20px;">
                            <label style="color: #888; margin-bottom: 10px; display: block;">Amount (sats)</label>
                            <input type="number" id="bet-amount" placeholder="1000" min="100" style="width: 100%; padding: 12px; font-size: 1rem; background: #1a1a1a; border: 2px solid var(--border-color); border-radius: 8px; color: white;">
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <button onclick="placeBet('YES')" style="background: var(--yes-green); color: white; padding: 15px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer;">
                                BET YES
                            </button>
                            <button onclick="placeBet('NO')" style="background: var(--no-red); color: white; padding: 15px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer;">
                                BET NO
                            </button>
                        </div>
                    `;
                }

                modal.style.display = 'flex';
            } catch (error) {
                console.error('Failed to load market:', error);
                alert('Failed to load market details');
            }
        }

        async function placeBet(side) {
            const amount = parseInt(document.getElementById('bet-amount').value);
            if (!amount || amount < 100) {
                alert('Minimum bet is 100 sats');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/market/${currentMarket.id}/create-position`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ side: side, amount_sats: amount })
                });

                currentTicketData = await response.json();
                if (currentTicketData.error) {
                    alert(currentTicketData.error);
                    return;
                }

                displayInvoice(currentTicketData);
            } catch (error) {
                console.error('Failed to create position:', error);
                alert('Failed to create bet');
            }
        }

        function displayInvoice(data) {
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <h2 style="margin-bottom: 24px;">⚡ Pay Invoice</h2>

                <!-- QR CODE TOP -->
                <div style="text-align: center; margin-bottom: 24px; padding: 20px; background: white; border-radius: 12px; display: inline-block; width: 100%;">
                    <div id="qrcode" style="display: inline-block;"></div>
                    <p style="color: #333; font-size: 0.85rem; margin-top: 12px;">Scan with your Lightning wallet</p>
                </div>

                <!-- COPY INVOICE -->
                <div style="margin-bottom: 24px; padding: 16px; background: rgba(247,147,26,0.08); border: 1px solid rgba(247,147,26,0.3); border-radius: 10px;">
                    <p style="color: #888; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;">Lightning Invoice</p>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="invoice-text" value="${data.invoice}" readonly style="flex: 1; padding: 10px; background: #111; border: 1px solid #333; border-radius: 6px; color: #aaa; font-size: 0.78rem; font-family: monospace; margin-bottom: 0; overflow: hidden; text-overflow: ellipsis;">
                        <button onclick="copyInvoice()" style="padding: 10px 18px; background: var(--btc-orange); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; white-space: nowrap; flex-shrink: 0;">Copy</button>
                    </div>
                </div>

                <!-- TICKET + CLAIM KEY BOTTOM -->
                <div style="padding: 20px; background: linear-gradient(135deg, #1a1a1a 0%, #222 100%); border: 2px solid var(--btc-orange); border-radius: 12px; margin-bottom: 16px;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 16px;">
                        <div>
                            <p style="color: #888; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">Your Ticket</p>
                            <div style="font-family: monospace; font-size: 1.3rem; font-weight: bold; color: white;">${data.ticket_number}</div>
                        </div>
                        <div style="text-align: right; display: flex; align-items: center; justify-content: flex-end;">
                            <span style="background: rgba(247,147,26,0.15); border: 1px solid var(--btc-orange); color: var(--btc-orange); padding: 4px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: bold;">PENDING PAYMENT</span>
                        </div>
                    </div>
                    <div>
                        <p style="color: #888; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">Claim Key — Keep this safe!</p>
                        <div style="font-family: monospace; font-size: 0.8rem; word-break: break-all; color: var(--btc-orange); background: #111; padding: 10px; border-radius: 6px;">${data.signature}</div>
                    </div>
                </div>

                <p style="text-align: center; color: #555; font-size: 0.88rem;">⏳ Checking for payment every 2 seconds...</p>
            `;

            new QRCode(document.getElementById('qrcode'), {
                text: data.invoice.toUpperCase(),
                width: 240,
                height: 240,
                colorDark: '#000000',
                colorLight: '#ffffff'
            });

            startPaymentCheck(data.ticket_number, currentMarket.id);
        }

        function copyInvoice() {
            const input = document.getElementById('invoice-text');
            input.select();
            document.execCommand('copy');
            alert('Invoice copied to clipboard!');
        }

        function startPaymentCheck(ticketNumber, marketId) {
            if (checkInterval) clearInterval(checkInterval);
            checkInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE}/ticket/${ticketNumber}/status`);
                    const data = await response.json();
                    if (data.status === 'confirmed') {
                        clearInterval(checkInterval);
                        showPaymentSuccess(data);
                    }
                } catch (error) {
                    console.error('Payment check failed:', error);
                }
            }, 2000);
        }

        function showPaymentSuccess(data) {
            const content = document.getElementById('modal-content');
            const sideColor = data.side === 'YES' ? 'var(--yes-green)' : 'var(--no-red)';
            content.innerHTML = `
                <div style="text-align: center; margin-bottom: 24px;">
                    <div style="font-size: 3rem; margin-bottom: 8px;">✅</div>
                    <h2 style="color: var(--yes-green); font-size: 1.8rem;">Payment Confirmed!</h2>
                </div>

                <div style="text-align: center; margin-bottom: 24px; padding: 20px; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.3); border-radius: 12px;">
                    <p style="color: #888; font-size: 0.85rem; margin-bottom: 6px;">Your Position</p>
                    <div style="font-size: 2rem; font-weight: bold; color: ${sideColor};">${data.amount_sats.toLocaleString()} sats on ${data.side}</div>
                </div>

                <div style="padding: 20px; background: linear-gradient(135deg, #1a1a1a, #222); border: 2px solid var(--btc-orange); border-radius: 12px; margin-bottom: 16px;">
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
                        <span style="font-size: 1.1rem;">⚠️</span>
                        <span style="color: var(--btc-orange); font-weight: bold;">Save These — You'll need them to claim winnings</span>
                    </div>

                    <div style="margin-bottom: 14px;">
                        <p style="color: #888; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">Ticket Number</p>
                        <div style="font-family: monospace; font-size: 1.3rem; font-weight: bold; padding: 10px 14px; background: #111; border-radius: 6px; letter-spacing: 2px;">${data.ticket_number}</div>
                    </div>

                    <div>
                        <p style="color: #888; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">Claim Key</p>
                        <div style="font-family: monospace; font-size: 0.8rem; word-break: break-all; padding: 10px 14px; background: #111; border-radius: 6px; color: var(--btc-orange);">${data.signature}</div>
                    </div>
                </div>

                <button id="copy-all-btn" onclick="copyAllDetails('${data.amount_sats}', '${data.side}', '${data.ticket_number}', '${data.signature}')" style="width: 100%; padding: 15px; background: #2a2a2a; border: 2px solid var(--btc-orange); color: var(--btc-orange); border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 12px; transition: all 0.2s;">
                    📋 Copy All Details to Clipboard
                </button>

                <button onclick="closeModal(); loadMarkets();" style="width: 100%; padding: 15px; background: var(--btc-orange); color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer;">
                    Done
                </button>
            `;
        }

        function copyAllDetails(amount, side, ticketNumber, signature) {
            const text = `=== Satoshi's Market — Bet Receipt ===\nPosition: ${amount} sats on ${side}\nTicket Number: ${ticketNumber}\nClaim Key: ${signature}\n======================================`;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-all-btn');
                btn.textContent = '✅ Copied!';
                btn.style.background = 'rgba(34,197,94,0.15)';
                btn.style.borderColor = 'var(--yes-green)';
                btn.style.color = 'var(--yes-green)';
                setTimeout(() => {
                    btn.textContent = '📋 Copy All Details to Clipboard';
                    btn.style.background = '#2a2a2a';
                    btn.style.borderColor = 'var(--btc-orange)';
                    btn.style.color = 'var(--btc-orange)';
                }, 2500);
            }).catch(() => {
                // Fallback for older browsers
                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                const btn = document.getElementById('copy-all-btn');
                btn.textContent = '✅ Copied!';
                setTimeout(() => { btn.textContent = '📋 Copy All Details to Clipboard'; }, 2500);
            });
        }

        async function claimWinnings() {
            const ticketNumber = document.getElementById('claim-ticket-number').value.trim();
            const signature = document.getElementById('claim-signature').value.trim();
            const lightningAddress = document.getElementById('claim-lightning-address').value.trim();

            if (!ticketNumber || !signature || !lightningAddress) {
                alert('Please fill in all fields');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/claim-winnings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticket_number: ticketNumber, signature: signature, lightning_address: lightningAddress })
                });

                const data = await response.json();
                if (data.error) {
                    alert('Error: ' + data.error);
                } else {
                    alert(`Success! ${data.payout} sats sent to ${lightningAddress}`);
                    document.getElementById('claim-ticket-number').value = '';
                    document.getElementById('claim-signature').value = '';
                    document.getElementById('claim-lightning-address').value = '';
                    loadMarkets();
                }
            } catch (error) {
                console.error('Claim failed:', error);
                alert('Failed to claim winnings');
            }
        }

        function closeModal() {
            document.getElementById('bet-modal').style.display = 'none';
            if (checkInterval) {
                clearInterval(checkInterval);
                checkInterval = null;
            }
        }

        loadMarkets();
        setInterval(loadMarkets, 30000);
    </script>
</body>
</html>
