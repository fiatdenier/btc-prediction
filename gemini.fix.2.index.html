<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satoshi's Market</title>
    <style>
        :root {
            --btc-orange: #f7931a;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --yes-green: #22c55e;
            --no-red: #ef4444;
            --border-color: #2a2a2a;
        }
        body { font-family: 'Inter', sans-serif; background: var(--dark-bg); color: white; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .markets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .market-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; position: relative; }
        .status-badge { font-size: 0.7rem; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; font-weight: bold; }
        .phase-betting { background: rgba(34, 197, 94, 0.2); color: var(--yes-green); }
        .phase-sweat { background: rgba(239, 68, 68, 0.2); color: var(--no-red); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        .countdown-timer { display: block; margin-top: 10px; font-size: 0.9rem; color: #888; }
        .btn-yes { background: var(--yes-green); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-no { background: var(--no-red); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; z-index: 100; }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: 15px; width: 400px; text-align: center; border: 1px solid var(--btc-orange); }
        #qrcode img { margin: 0 auto; border: 10px solid white; border-radius: 10px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <h1 style="color: var(--btc-orange); text-align: center; margin-bottom: 40px;">Satoshi's Market</h1>
        <div id="markets-grid" class="markets-grid"></div>
    </div>

    <div id="bet-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Place Bet</h2>
            <div id="bet-setup">
                <input type="number" id="bet-amount" value="1000" style="width: 100%; padding: 10px; margin: 20px 0; background: #000; color: white; border: 1px solid #333;">
                <button class="btn-yes" onclick="generateInvoice()">Pay with Lightning</button>
                <button onclick="closeModal()" style="background:none; border:none; color:#888; margin-top:15px; cursor:pointer;">Cancel</button>
            </div>
            <div id="payment-area" style="display:none;">
                <div id="qrcode"></div>
                <p id="invoice-status" style="margin-top:15px; color:var(--btc-orange)">Waiting for payment...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://predict.fiatdenier.com/api';
        let countdownIntervals = {};
        let currentMarketId = null;
        let currentSide = null;

        async function loadMarkets() {
            try {
                const res = await fetch(`${API_BASE}/markets`);
                const data = await res.json();
                renderMarkets(data.active);
            } catch (e) { console.error("Load failed", e); }
        }

        function renderMarkets(markets) {
            const grid = document.getElementById('markets-grid');
            grid.innerHTML = '';
            Object.values(countdownIntervals).forEach(clearInterval);
            
            markets.forEach(m => {
                const card = document.createElement('div');
                card.className = 'market-card';
                
                // # Sweat Phase Logic
                const isSweating = m.phase === 'sweat';
                const seconds = isSweating ? m.sweat_seconds_left : m.seconds_left;
                const phaseLabel = isSweating ? "Sweat Phase" : "Open Phase";
                const timeLabel = isSweating ? "Sudden Death Ends" : "Betting Closes";
                
                card.innerHTML = `
                    <span class="status-badge ${isSweating ? 'phase-sweat' : 'phase-betting'}">${phaseLabel}</span>
                    <h3 style="margin-top:10px;">${m.question}</h3>
                    <span class="countdown-timer" id="timer-${m.id}">${timeLabel}: ${formatTime(seconds)}</span>
                    <div class="action-btns">
                        <button class="btn-yes" onclick="openBetModal('${m.id}', 'YES')" ${isSweating ? 'disabled' : ''}>YES</button>
                        <button class="btn-no" onclick="openBetModal('${m.id}', 'NO')" ${isSweating ? 'disabled' : ''}>NO</button>
                    </div>
                `;
                grid.appendChild(card);
                startTicker(m.id, seconds, timeLabel);
            });
        }

        function startTicker(id, sec, label) {
            let current = sec;
            countdownIntervals[id] = setInterval(() => {
                current--;
                const el = document.getElementById(`timer-${id}`);
                if (el) el.innerText = `${label}: ${formatTime(current)}`;
                if (current <= 0) clearInterval(countdownIntervals[id]);
            }, 1000);
        }

        function formatTime(s) {
            if (s <= 0) return "00:00:00";
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }

        function openBetModal(id, side) {
            currentMarketId = id;
            currentSide = side;
            document.getElementById('bet-modal').style.display = 'flex';
            document.getElementById('bet-setup').style.display = 'block';
            document.getElementById('payment-area').style.display = 'none';
        }

        function closeModal() {
            document.getElementById('bet-modal').style.display = 'none';
        }

        async function generateInvoice() {
            const amount = document.getElementById('bet-amount').value;
            try {
                // # FIX: Ensure NO trailing slash in the fetch URL
                const response = await fetch(`${API_BASE}/bet`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        market_id: currentMarketId, 
                        side: currentSide, 
                        amount_sats: parseInt(amount) 
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error);

                document.getElementById('bet-setup').style.display = 'none';
                document.getElementById('payment-area').style.display = 'block';
                
                const qrDiv = document.getElementById('qrcode');
                qrDiv.innerHTML = '';
                new QRCode(qrDiv, { text: data.payment_request, width: 200, height: 200 });
                
                // Start status polling here...
            } catch (e) {
                alert("Error: " + e.message);
                console.error(e);
            }
        }

        loadMarkets();
    </script>
</body>
</html>
