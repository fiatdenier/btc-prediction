<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satoshi's Market - Bitcoin Prediction Markets</title>
    <style>
        :root {
            --btc-orange: #f7931a;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --yes-green: #22c55e;
            --no-red: #ef4444;
            --border-color: #2a2a2a;
            --resolved-green: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--dark-bg);
            color: white;
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            padding: 20px 0 40px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            color: var(--btc-orange);
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .subtitle { 
            color: #888; 
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .markets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .market-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .market-card:hover {
            border-color: var(--btc-orange);
            transform: translateY(-2px);
        }

        .market-card.resolved {
            border-color: var(--resolved-green);
            background: linear-gradient(135deg, #1a1a1a 0%, #1a2a1a 100%);
        }

        .market-card.resolved:hover {
            border-color: var(--resolved-green);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }

        .market-question {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
            min-height: 60px;
        }

        .market-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .stat { text-align: center; }

        .stat-label {
            color: #888;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .stat-value { font-size: 1.5rem; font-weight: bold; }
        .yes-value { color: var(--yes-green); }
        .no-value { color: var(--no-red); }

        .market-pool {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .market-pool strong { color: var(--btc-orange); }

        .countdown {
            background: rgba(247, 147, 26, 0.1);
            border: 1px solid var(--btc-orange);
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            text-align: center;
        }

        .countdown-label {
            color: #888;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .countdown-time {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--btc-orange);
        }

        .countdown-units {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-top: 5px;
        }

        .countdown-unit {
            text-align: center;
        }

        .countdown-unit .number {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--btc-orange);
            display: block;
        }

        .countdown-unit .label {
            font-size: 0.65rem;
            color: #888;
            text-transform: uppercase;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .status-open { background: rgba(34, 197, 94, 0.2); color: var(--yes-green); }
        .status-closed { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .status-resolved { 
            background: rgba(34, 197, 94, 0.3); 
            color: var(--resolved-green);
            border: 1px solid var(--resolved-green);
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ccc;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #888;
            font-size: 1.1rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--btc-orange);
            border-radius: 12px;
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: #888;
            background: none;
            border: none;
        }

        .close-modal:hover { color: white; }

        .action-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-yes { background: var(--yes-green); color: white; }
        .btn-yes:hover { background: #16a34a; }
        .btn-no { background: var(--no-red); color: white; }
        .btn-no:hover { background: #dc2626; }

        input {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        input:focus {
            outline: none;
            border-color: var(--btc-orange);
        }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .quick-amt-btn {
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .quick-amt-btn:hover {
            background: #3a3a3a;
            border-color: var(--btc-orange);
        }

        .claim-section {
            background: var(--card-bg);
            border: 2px solid var(--yes-green);
            border-radius: 12px;
            padding: 30px;
            margin-top: 40px;
        }

        .ticket-display {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 2px solid var(--btc-orange);
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>⚡ Satoshi's Market</h1>
                    <div class="subtitle">Predict the Future. Win Sats. Powered by Lightning Network ⚡</div>
                </div>
                <div style="text-align: right;">
                    <label style="color: #888; font-size: 0.9rem; cursor: pointer;">
                        <input type="checkbox" id="timezone-toggle" style="margin-right: 8px;">
                        Show times in EST (default: UTC)
                    </label>
                </div>
            </div>
        </header>

        <h2 class="section-title">🔥 Active Markets</h2>
        <div id="active-markets" class="markets-grid">
            <div class="loading">Loading markets...</div>
        </div>

        <div id="resolved-section" style="display: none; margin-top: 60px;">
            <h2 class="section-title">✅ Recently Resolved</h2>
            <div id="resolved-markets" class="markets-grid"></div>
        </div>

        <div id="claim-section" class="claim-section" style="display: none;">
            <h2 style="margin-top: 0;">💰 Claim Your Winnings</h2>
            <input type="text" id="claim-ticket-number" placeholder="Ticket Number">
            <input type="text" id="claim-signature" placeholder="Claim Key">
            <input type="text" id="claim-lightning-address" placeholder="Lightning Address">
            <button class="action-btn btn-yes" onclick="claimWinnings()">💸 CLAIM WINNINGS</button>
            <div id="claim-status" style="margin-top: 20px;"></div>
        </div>
    </div>

    <div id="bet-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeBetModal()">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <script>
        const API_BASE = 'https://predict.fiatdenier.com/api';
        let currentMarket = null;
        let currentTicketData = null;
        let checkInterval = null;
        let countdownIntervals = {};

        document.addEventListener('DOMContentLoaded', () => {
            const toggle = document.getElementById('timezone-toggle');
            if (toggle) {
                toggle.addEventListener('change', () => loadMarkets());
            }
        });

        // --- FIXED TIME LOGIC ---
        function getSafeUTCDate(dateString) {
            // If the dateString doesn't end with Z or have a timezone, append Z to force UTC interpretation
            const cleanDate = dateString.includes('Z') || dateString.includes('+') 
                ? dateString 
                : dateString.replace(' ', 'T') + 'Z';
            return new Date(cleanDate);
        }

        function calculateTimeRemaining(deadline) {
            const end = getSafeUTCDate(deadline).getTime();
            const now = new Date().getTime();
            const diff = end - now;

            if (diff <= 0) return { expired: true, days: 0, hours: 0, minutes: 0, seconds: 0 };

            return {
                expired: false,
                days: Math.floor(diff / (1000 * 60 * 60 * 24)),
                hours: Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                minutes: Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)),
                seconds: Math.floor((diff % (1000 * 60)) / 1000)
            };
        }

        function updateCountdown(marketId, deadline) {
            const element = document.getElementById(`countdown-${marketId}`);
            if (!element) return;

            const time = calculateTimeRemaining(deadline);
            const showEST = document.getElementById('timezone-toggle')?.checked || false;
            const dateObj = getSafeUTCDate(deadline);

            let deadlineFormatted, timezoneSuffix;

            if (showEST) {
                deadlineFormatted = dateObj.toLocaleString('en-US', {
                    timeZone: 'America/New_York',
                    month: 'short', day: 'numeric', year: 'numeric',
                    hour: 'numeric', minute: '2-digit', hour12: true
                });
                timezoneSuffix = 'EST';
            } else {
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                let hours = dateObj.getUTCHours();
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = (hours % 12) || 12;
                const minutes = String(dateObj.getUTCMinutes()).padStart(2, '0');
                
                deadlineFormatted = `${months[dateObj.getUTCMonth()]} ${dateObj.getUTCDate()}, ${dateObj.getUTCFullYear()}, ${hours}:${minutes} ${ampm}`;
                timezoneSuffix = 'UTC';
            }

            if (time.expired) {
                element.innerHTML = `<div class="countdown-label">Betting Closed</div><div class="countdown-time" style="color: #888;">Deadline: ${deadlineFormatted} ${timezoneSuffix}</div>`;
                return;
            }

            element.innerHTML = `
                <div class="countdown-label">Deadline: ${deadlineFormatted} ${timezoneSuffix}</div>
                <div class="countdown-units">
                    <div class="countdown-unit"><span class="number">${time.days}</span><span class="label">Days</span></div>
                    <div class="countdown-unit"><span class="number">${String(time.hours).padStart(2, '0')}</span><span class="label">Hours</span></div>
                    <div class="countdown-unit"><span class="number">${String(time.minutes).padStart(2, '0')}</span><span class="label">Mins</span></div>
                    <div class="countdown-unit"><span class="number">${String(time.seconds).padStart(2, '0')}</span><span class="label">Secs</span></div>
                </div>`;
        }
        // --- END FIXED TIME LOGIC ---

        function startCountdown(marketId, deadline) {
            if (countdownIntervals[marketId]) clearInterval(countdownIntervals[marketId]);
            updateCountdown(marketId, deadline);
            countdownIntervals[marketId] = setInterval(() => updateCountdown(marketId, deadline), 1000);
        }

        async function loadMarkets() {
            try {
                const response = await fetch(`${API_BASE}/markets`);
                const data = await response.json();
                displayMarkets(data.active, 'active-markets');
                if (data.resolved?.length > 0) {
                    document.getElementById('resolved-section').style.display = 'block';
                    displayMarkets(data.resolved, 'resolved-markets');
                    document.getElementById('claim-section').style.display = 'block';
                }
            } catch (error) { console.error('Failed to load markets:', error); }
        }

        function displayMarkets(markets, containerId) {
            const container = document.getElementById(containerId);
            if (!markets || markets.length === 0) {
                container.innerHTML = '<div class="loading">No markets available</div>';
                return;
            }
            container.innerHTML = markets.map(market => {
                const isResolved = market.status === 'resolved';
                return `
                    <div class="market-card ${isResolved ? 'resolved' : ''}" onclick="openMarket('${market.id}')">
                        <div class="status-badge status-${market.status}">${market.status}</div>
                        <div class="market-question">${market.question}</div>
                        <div class="market-stats">
                            <div class="stat"><div class="stat-label">YES</div><div class="stat-value yes-value">${market.yes_percentage}%</div></div>
                            <div class="stat"><div class="stat-label">NO</div><div class="stat-value no-value">${market.no_percentage}%</div></div>
                        </div>
                        <div class="market-pool">Total Pool: <strong>${market.total_pool.toLocaleString()} sats</strong></div>
                        ${!isResolved ? `<div class="countdown" id="countdown-${market.id}"></div>` : `<div style="text-align:center;color:var(--resolved-green);font-weight:bold;">✓ ${market.outcome} Won</div>`}
                    </div>`;
            }).join('');
            markets.forEach(market => { if (market.status === 'open') startCountdown(market.id, market.deadline); });
        }

        async function openMarket(marketId) {
            try {
                const response = await fetch(`${API_BASE}/market/${marketId}`);
                currentMarket = await response.json();
                currentMarket.id = marketId;
                const modal = document.getElementById('bet-modal');
                const content = document.getElementById('modal-content');
                if (currentMarket.status !== 'open') {
                    content.innerHTML = `<h2>${currentMarket.question}</h2><div style="text-align:center;padding:40px;">Market is ${currentMarket.status}. Outcome: ${currentMarket.outcome || 'N/A'}</div>`;
                } else {
                    content.innerHTML = `
                        <h2>${currentMarket.question}</h2>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:20px 0;">
                            <div style="text-align:center;background:rgba(34,197,94,0.1);padding:10px;">${currentMarket.yes_percentage}% YES</div>
                            <div style="text-align:center;background:rgba(239,68,68,0.1);padding:10px;">${currentMarket.no_percentage}% NO</div>
                        </div>
                        <input type="number" id="bet-amount" value="100">
                        <button class="action-btn btn-yes" onclick="placeBet('YES')">BUY YES</button>
                        <button class="action-btn btn-no" onclick="placeBet('NO')">BUY NO</button>`;
                }
                modal.style.display = 'block';
            } catch (e) { alert('Error opening market'); }
        }

        async function placeBet(side) {
            const amount = parseInt(document.getElementById('bet-amount').value);
            const response = await fetch(`${API_BASE}/market/${currentMarket.id}/create-position`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ side, amount })
            });
            const data = await response.json();
            currentTicketData = data;
            showInvoice(data);
        }

        function showInvoice(data) {
            const content = document.getElementById('modal-content');
            content.innerHTML = `<h3>Pay Invoice</h3><div id="qr-code"></div><p style="word-break:break-all;font-family:monospace;font-size:0.8rem;">${data.invoice}</p>`;
            new QRCode(document.getElementById('qr-code'), { text: data.invoice, width: 200, height: 200 });
            checkPayment(data.market_id, data.ticket_number);
        }

        function checkPayment(mId, tNum) {
            checkInterval = setInterval(async () => {
                const res = await fetch(`${API_BASE}/market/${mId}/confirm-position/${tNum}`, { method: 'POST' });
                const d = await res.json();
                if (d.status === 'confirmed') { clearInterval(checkInterval); alert('Paid!'); closeBetModal(); loadMarkets(); }
            }, 2000);
        }

        async function claimWinnings() {
            const t = document.getElementById('claim-ticket-number').value, s = document.getElementById('claim-signature').value, l = document.getElementById('claim-lightning-address').value;
            const res = await fetch(`${API_BASE}/claim-winnings`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ticket_number: t, signature: s, lightning_address: l })});
            const d = await res.json();
            document.getElementById('claim-status').innerText = d.error || 'Success!';
        }

        function closeBetModal() { document.getElementById('bet-modal').style.display = 'none'; clearInterval(checkInterval); }
        loadMarkets();
    </script>
</body>
</html>
