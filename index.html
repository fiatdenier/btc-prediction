<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satoshi's Market - Bitcoin Prediction Markets</title>
    <style>
        :root {
            --btc-orange: #f7931a;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --yes-green: #22c55e;
            --no-red: #ef4444;
            --border-color: #2a2a2a;
            --resolved-green: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--dark-bg);
            color: white;
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            padding: 20px 0 40px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            color: var(--btc-orange);
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .subtitle { 
            color: #888; 
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .markets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .market-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .market-card:hover {
            border-color: var(--btc-orange);
            transform: translateY(-2px);
        }

        .market-card.resolved {
            border-color: var(--resolved-green);
            background: linear-gradient(135deg, #1a1a1a 0%, #1a2a1a 100%);
        }

        .market-card.resolved:hover {
            border-color: var(--resolved-green);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }

        .market-question {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
            min-height: 60px;
        }

        .market-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .stat { text-align: center; }

        .stat-label {
            color: #888;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .stat-value { font-size: 1.5rem; font-weight: bold; }
        .yes-value { color: var(--yes-green); }
        .no-value { color: var(--no-red); }

        .market-pool {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .market-pool strong { color: var(--btc-orange); }

        .countdown {
            background: rgba(247, 147, 26, 0.1);
            border: 1px solid var(--btc-orange);
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            text-align: center;
        }

        .countdown-label {
            color: #888;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .countdown-time {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--btc-orange);
        }

        .countdown-units {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-top: 5px;
        }

        .countdown-unit {
            text-align: center;
        }

        .countdown-unit .number {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--btc-orange);
            display: block;
        }

        .countdown-unit .label {
            font-size: 0.65rem;
            color: #888;
            text-transform: uppercase;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .status-open { background: rgba(34, 197, 94, 0.2); color: var(--yes-green); }
        .status-closed { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .status-resolved { 
            background: rgba(34, 197, 94, 0.3); 
            color: var(--resolved-green);
            border: 1px solid var(--resolved-green);
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ccc;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #888;
            font-size: 1.1rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--btc-orange);
            border-radius: 12px;
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: #888;
            background: none;
            border: none;
        }

        .close-modal:hover { color: white; }

        .action-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-yes { background: var(--yes-green); color: white; }
        .btn-yes:hover { background: #16a34a; }
        .btn-no { background: var(--no-red); color: white; }
        .btn-no:hover { background: #dc2626; }

        input {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        input:focus {
            outline: none;
            border-color: var(--btc-orange);
        }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .quick-amt-btn {
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .quick-amt-btn:hover {
            background: #3a3a3a;
            border-color: var(--btc-orange);
        }

        .claim-section {
            background: var(--card-bg);
            border: 2px solid var(--yes-green);
            border-radius: 12px;
            padding: 30px;
            margin-top: 40px;
        }

        .ticket-display {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 2px solid var(--btc-orange);
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Satoshi's Market</h1>
            <div class="subtitle">Predict the Future. Win Sats. Powered by Lightning Network ⚡</div>
        </header>

        <h2 class="section-title">🔥 Active Markets</h2>
        <div id="active-markets" class="markets-grid">
            <div class="loading">Loading markets...</div>
        </div>

        <div id="resolved-section" style="display: none; margin-top: 60px;">
            <h2 class="section-title">✅ Recently Resolved</h2>
            <div id="resolved-markets" class="markets-grid"></div>
        </div>

        <!-- Claim Winnings Section -->
        <div id="claim-section" class="claim-section" style="display: none;">
            <h2 style="margin-top: 0;">💰 Claim Your Winnings</h2>
            
            <p style="color: #888; margin-bottom: 20px;">
                If you have a winning ticket, enter your details below to claim your payout.
            </p>

            <input type="text" id="claim-ticket-number" placeholder="Ticket Number (e.g., ABC123XY)">
            <input type="text" id="claim-signature" placeholder="Claim Key (your secret signature)" style="font-family: monospace;">
            <input type="text" id="claim-lightning-address" placeholder="Lightning Address (you@getalby.com) or Invoice">

            <button class="action-btn btn-yes" onclick="claimWinnings()">
                💸 CLAIM WINNINGS
            </button>

            <div id="claim-status" style="margin-top: 20px;"></div>
        </div>
    </div>

    <!-- Bet Modal -->
    <div id="bet-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeBetModal()">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <script>
        const API_BASE = 'https://predict.fiatdenier.com';
        let currentMarket = null;
        let currentTicketData = null;
        let checkInterval = null;
        let countdownIntervals = {};

        function calculateTimeRemaining(deadline) {
            const now = new Date().getTime();
            const end = new Date(deadline).getTime();
            const diff = end - now;

            if (diff <= 0) {
                return { expired: true, days: 0, hours: 0, minutes: 0, seconds: 0 };
            }

            return {
                expired: false,
                days: Math.floor(diff / (1000 * 60 * 60 * 24)),
                hours: Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                minutes: Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)),
                seconds: Math.floor((diff % (1000 * 60)) / 1000)
            };
        }

        function updateCountdown(marketId, deadline) {
            const element = document.getElementById(`countdown-${marketId}`);
            if (!element) return;

            const time = calculateTimeRemaining(deadline);

            if (time.expired) {
                element.innerHTML = `
                    <div class="countdown-label">Betting Closed</div>
                    <div class="countdown-time" style="color: #888;">Deadline Passed</div>
                `;
                if (countdownIntervals[marketId]) {
                    clearInterval(countdownIntervals[marketId]);
                    delete countdownIntervals[marketId];
                }
                return;
            }

            element.innerHTML = `
                <div class="countdown-label">Time Remaining</div>
                <div class="countdown-units">
                    <div class="countdown-unit">
                        <span class="number">${time.days}</span>
                        <span class="label">Days</span>
                    </div>
                    <div class="countdown-unit">
                        <span class="number">${String(time.hours).padStart(2, '0')}</span>
                        <span class="label">Hours</span>
                    </div>
                    <div class="countdown-unit">
                        <span class="number">${String(time.minutes).padStart(2, '0')}</span>
                        <span class="label">Mins</span>
                    </div>
                    <div class="countdown-unit">
                        <span class="number">${String(time.seconds).padStart(2, '0')}</span>
                        <span class="label">Secs</span>
                    </div>
                </div>
            `;
        }

        function startCountdown(marketId, deadline) {
            // Clear existing interval if any
            if (countdownIntervals[marketId]) {
                clearInterval(countdownIntervals[marketId]);
            }

            // Update immediately
            updateCountdown(marketId, deadline);

            // Then update every second
            countdownIntervals[marketId] = setInterval(() => {
                updateCountdown(marketId, deadline);
            }, 1000);
        }

        async function loadMarkets() {
            try {
                const response = await fetch(`${API_BASE}/markets`);
                const data = await response.json();

                displayMarkets(data.active, 'active-markets');

                if (data.resolved && data.resolved.length > 0) {
                    document.getElementById('resolved-section').style.display = 'block';
                    displayMarkets(data.resolved, 'resolved-markets');
                    document.getElementById('claim-section').style.display = 'block';
                }
            } catch (error) {
                console.error('Failed to load markets:', error);
                document.getElementById('active-markets').innerHTML = 
                    '<div class="loading">Failed to load markets</div>';
            }
        }

        function displayMarkets(markets, containerId) {
            const container = document.getElementById(containerId);

            if (!markets || markets.length === 0) {
                container.innerHTML = '<div class="loading">No markets available</div>';
                return;
            }

            container.innerHTML = markets.map(market => {
                const isResolved = market.status === 'resolved';
                const resolvedClass = isResolved ? 'resolved' : '';
                
                return `
                    <div class="market-card ${resolvedClass}" onclick="openMarket('${market.id}')">
                        <div class="status-badge status-${market.status}">${market.status}</div>
                        <div class="market-question">${market.question}</div>
                        
                        <div class="market-stats">
                            <div class="stat">
                                <div class="stat-label">YES</div>
                                <div class="stat-value yes-value">${market.yes_percentage}%</div>
                            </div>
                            <div class="stat">
                                <div class="stat-label">NO</div>
                                <div class="stat-value no-value">${market.no_percentage}%</div>
                            </div>
                        </div>

                        <div class="market-pool">
                            Total Pool: <strong>${market.total_pool.toLocaleString()} sats</strong>
                        </div>

                        ${!isResolved ? `
                            <div class="countdown" id="countdown-${market.id}">
                                <div class="countdown-label">Loading...</div>
                            </div>
                        ` : `
                            <div style="text-align: center; margin-top: 10px; padding: 10px; background: rgba(34, 197, 94, 0.1); border-radius: 8px;">
                                <div style="color: var(--resolved-green); font-weight: bold; font-size: 1.1rem;">
                                    ✓ ${market.outcome} Won
                                </div>
                            </div>
                        `}
                    </div>
                `;
            }).join('');

            // Start countdowns for active markets
            markets.forEach(market => {
                if (market.status === 'open') {
                    startCountdown(market.id, market.deadline);
                }
            });
        }

        async function openMarket(marketId) {
            try {
                const response = await fetch(`${API_BASE}/market/${marketId}`);
                currentMarket = await response.json();
                currentMarket.id = marketId;

                const modal = document.getElementById('bet-modal');
                const content = document.getElementById('modal-content');

                if (currentMarket.status !== 'open') {
                    content.innerHTML = `
                        <h2>${currentMarket.question}</h2>
                        <div style="text-align: center; padding: 40px; color: #888;">
                            <p>This market is ${currentMarket.status}.</p>
                            ${currentMarket.outcome ? `<p style="margin-top: 20px; font-size: 1.5rem;">Outcome: <strong style="color: var(--btc-orange);">${currentMarket.outcome}</strong></p>` : ''}
                        </div>
                    `;
                } else {
                    content.innerHTML = `
                        <h2 style="margin-bottom: 20px;">${currentMarket.question}</h2>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px;">
                            <div style="text-align: center; padding: 15px; background: rgba(34, 197, 94, 0.1); border-radius: 8px;">
                                <div style="color: var(--yes-green); font-size: 2rem; font-weight: bold;">${currentMarket.yes_percentage}%</div>
                                <div style="color: #888;">YES</div>
                                <div style="color: var(--yes-green); margin-top: 5px;">${currentMarket.yes_total} sats</div>
                            </div>
                            <div style="text-align: center; padding: 15px; background: rgba(239, 68, 68, 0.1); border-radius: 8px;">
                                <div style="color: var(--no-red); font-size: 2rem; font-weight: bold;">${currentMarket.no_percentage}%</div>
                                <div style="color: #888;">NO</div>
                                <div style="color: var(--no-red); margin-top: 5px;">${currentMarket.no_total} sats</div>
                            </div>
                        </div>

                        <label style="display: block; color: #888; margin-bottom: 10px;">Amount (sats)</label>
                        <input type="number" id="bet-amount" placeholder="100" min="10" value="100">

                        <div class="quick-amounts">
                            <button class="quick-amt-btn" onclick="setBetAmount(100)">100</button>
                            <button class="quick-amt-btn" onclick="setBetAmount(500)">500</button>
                            <button class="quick-amt-btn" onclick="setBetAmount(1000)">1K</button>
                            <button class="quick-amt-btn" onclick="setBetAmount(5000)">5K</button>
                        </div>

                        <div style="background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
                            <div style="color: #888; font-size: 0.85rem; margin-bottom: 5px;">Estimated Payout If Win</div>
                            <div id="estimated-payout-yes" style="font-size: 1.3rem; font-weight: bold; color: var(--yes-green); margin: 5px 0;">YES: ~0 sats</div>
                            <div id="estimated-payout-no" style="font-size: 1.3rem; font-weight: bold; color: var(--no-red);">NO: ~0 sats</div>
                        </div>

                        <button class="action-btn btn-yes" onclick="placeBet('YES')">BUY YES</button>
                        <button class="action-btn btn-no" onclick="placeBet('NO')">BUY NO</button>
                    `;

                    document.getElementById('bet-amount').addEventListener('input', updateEstimates);
                    updateEstimates();
                }

                modal.style.display = 'block';
            } catch (error) {
                console.error('Failed to load market:', error);
                alert('Failed to load market details');
            }
        }

        function setBetAmount(amount) {
            document.getElementById('bet-amount').value = amount;
            updateEstimates();
        }

        function updateEstimates() {
            const amount = parseInt(document.getElementById('bet-amount').value) || 0;
            
            if (amount === 0) {
                document.getElementById('estimated-payout-yes').textContent = 'YES: ~0 sats';
                document.getElementById('estimated-payout-no').textContent = 'NO: ~0 sats';
                return;
            }

            const currentYes = currentMarket.yes_total;
            const currentNo = currentMarket.no_total;
            const houseRake = currentMarket.house_rake / 100;

            // Calculate YES estimate
            const newYesTotal = currentYes + amount;
            const yesShare = amount / newYesTotal;
            const yesProfit = yesShare * currentNo * (1 - houseRake);
            const yesEstimate = amount + yesProfit;

            // Calculate NO estimate  
            const newNoTotal = currentNo + amount;
            const noShare = amount / newNoTotal;
            const noProfit = noShare * currentYes * (1 - houseRake);
            const noEstimate = amount + noProfit;

            document.getElementById('estimated-payout-yes').textContent = 
                'YES: ~' + Math.round(yesEstimate).toLocaleString() + ' sats';
            document.getElementById('estimated-payout-no').textContent = 
                'NO: ~' + Math.round(noEstimate).toLocaleString() + ' sats';
        }

        async function placeBet(side) {
            const amount = parseInt(document.getElementById('bet-amount').value);

            if (!amount || amount < 10) {
                alert('Minimum bet is 10 sats');
                return;
            }

            document.getElementById('modal-content').innerHTML = '<div class="loading">Creating position...</div>';

            try {
                const response = await fetch(`${API_BASE}/market/${currentMarket.id}/create-position`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ side: side, amount: amount })
                });

                const data = await response.json();

                if (data.error) {
                    alert(data.error);
                    closeBetModal();
                    return;
                }

                // Save ticket data
                currentTicketData = {
                    ticket_number: data.ticket_number,
                    signature: data.signature,
                    market_id: data.market_id,
                    side: data.side,
                    amount: data.amount,
                    estimated_payout: data.estimated_payout,
                    timestamp: data.timestamp
                };

                const myTickets = JSON.parse(localStorage.getItem('my_tickets') || '[]');
                myTickets.push(currentTicketData);
                localStorage.setItem('my_tickets', JSON.stringify(myTickets));

                showInvoice(data);

            } catch (error) {
                console.error('Bet failed:', error);
                alert('Failed to create bet');
                closeBetModal();
            }
        }

        function showInvoice(data) {
            const content = document.getElementById('modal-content');

            content.innerHTML = `
                <h3 style="text-align: center; margin-bottom: 20px;">Pay Invoice</h3>

                <div id="qr-code" style="text-align: center; margin: 20px 0;"></div>

                <div style="background: #0a0a0a; padding: 15px; border-radius: 8px; word-break: break-all; font-size: 0.85rem; font-family: monospace; margin-bottom: 20px;">
                    ${data.invoice}
                </div>

                <button class="action-btn" style="background: var(--btc-orange);" onclick="copyToClipboard('${data.invoice}')">
                    📋 COPY INVOICE
                </button>

                <div style="text-align: center; margin-top: 20px; color: #888; font-size: 0.9rem;">
                    Checking for payment...
                </div>
            `;

            new QRCode(document.getElementById('qr-code'), {
                text: data.invoice,
                width: 250,
                height: 250,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            checkPayment(data.market_id, data.ticket_number);
        }

        function checkPayment(marketId, ticketNumber) {
            if (checkInterval) clearInterval(checkInterval);

            checkInterval = setInterval(async () => {
                try {
                    const response = await fetch(
                        `${API_BASE}/market/${marketId}/confirm-position/${ticketNumber}`,
                        { method: 'POST' }
                    );
                    const data = await response.json();

                    if (data.status === 'confirmed' || data.status === 'already_confirmed') {
                        clearInterval(checkInterval);
                        showTicketDetails();
                    }
                } catch (error) {
                    console.error('Payment check failed:', error);
                }
            }, 2000);
        }

        function showTicketDetails() {
            const content = document.getElementById('modal-content');

            content.innerHTML = `
                <div style="text-align: center;">
                    <div style="font-size: 4rem; margin-bottom: 20px;">✅</div>
                    <h2 style="color: var(--yes-green); margin-bottom: 20px;">PAYMENT CONFIRMED!</h2>
                </div>

                <div class="ticket-display">
                    <div style="font-size: 0.9rem; color: #888; margin-bottom: 10px;">YOUR TICKET NUMBER</div>
                    <div style="font-size: 2.5rem; font-weight: bold; color: var(--btc-orange); 
                                margin-bottom: 15px; font-family: 'Courier New', monospace; letter-spacing: 3px;">
                        ${currentTicketData.ticket_number}
                    </div>
                    
                    <div style="font-size: 0.8rem; color: #888; margin-top: 20px; padding-top: 15px; border-top: 1px solid #404040;">
                        CLAIM KEY (Keep Secret!)
                    </div>
                    <div style="font-family: 'Courier New', monospace; font-size: 0.7rem; 
                                color: #666; word-break: break-all; margin-top: 10px; 
                                background: #000; padding: 10px; border-radius: 6px; max-height: 80px; overflow-y: auto;">
                        ${currentTicketData.signature}
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; 
                                margin-top: 20px; padding-top: 15px; border-top: 1px solid #404040;">
                        <div>
                            <div style="color: #888; font-size: 0.8rem;">SIDE</div>
                            <div style="font-size: 1.2rem; font-weight: bold; color: ${currentTicketData.side === 'YES' ? 'var(--yes-green)' : 'var(--no-red)'};">
                                ${currentTicketData.side}
                            </div>
                        </div>
                        <div>
                            <div style="color: #888; font-size: 0.8rem;">AMOUNT</div>
                            <div style="font-size: 1.2rem; font-weight: bold;">${currentTicketData.amount} sats</div>
                        </div>
                    </div>
                </div>

                <div style="background: rgba(255, 165, 0, 0.1); border: 1px solid var(--btc-orange); 
                            border-radius: 8px; padding: 15px; margin: 15px 0;">
                    <strong>⚠️ SAVE YOUR TICKET INFO!</strong>
                    <p style="margin: 10px 0 0 0; font-size: 0.9rem;">
                        You need BOTH the ticket number AND claim key to collect winnings. Keep it secret!
                    </p>
                </div>

                <button class="action-btn" style="background: var(--btc-orange);" 
                        onclick="copyTicketDetails()">
                    📋 COPY FULL TICKET INFO
                </button>

                <button class="action-btn btn-yes" onclick="closeBetModal(); loadMarkets();">
                    ✓ DONE
                </button>
            `;
        }

        function copyTicketDetails() {
            const fullTicket = `🎫 SATOSHI'S MARKET TICKET
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
TICKET NUMBER: ${currentTicketData.ticket_number}
MARKET ID: ${currentTicketData.market_id}

BET DETAILS:
  Side:              ${currentTicketData.side}
  Amount Bet:        ${currentTicketData.amount} sats
  
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
CLAIM KEY (keep secret):
${currentTicketData.signature}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

⚠️  Save both ticket number AND claim key!
You need BOTH to claim your winnings.
`;
            
            navigator.clipboard.writeText(fullTicket);
            alert('✅ Full ticket info copied! Keep this safe!');
        }

        async function claimWinnings() {
            const ticketNumber = document.getElementById('claim-ticket-number').value.trim();
            const signature = document.getElementById('claim-signature').value.trim();
            const lightningAddress = document.getElementById('claim-lightning-address').value.trim();

            if (!ticketNumber || !signature || !lightningAddress) {
                alert('Please fill all fields');
                return;
            }

            const statusDiv = document.getElementById('claim-status');
            statusDiv.innerHTML = '<div style="text-align: center; color: #888;">Processing claim...</div>';

            try {
                const response = await fetch(`${API_BASE}/claim-winnings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ticket_number: ticketNumber,
                        signature: signature,
                        lightning_address: lightningAddress
                    })
                });

                const data = await response.json();

                if (data.error) {
                    statusDiv.innerHTML = `
                        <div style="background: rgba(239, 68, 68, 0.2); border: 1px solid var(--no-red); 
                                    border-radius: 8px; padding: 15px;">
                            <strong>❌ ${data.error}</strong>
                        </div>
                    `;
                } else {
                    statusDiv.innerHTML = `
                        <div style="background: rgba(34, 197, 94, 0.2); border: 1px solid var(--yes-green); 
                                    border-radius: 8px; padding: 20px;">
                            <h3 style="margin: 0 0 15px 0; color: var(--yes-green);">✅ CLAIM SUCCESSFUL!</h3>
                            
                            <div style="display: grid; grid-template-columns: 120px 1fr; gap: 10px;">
                                <div style="color: #888;">Payout:</div>
                                <div style="font-size: 1.3rem; font-weight: bold;">${data.payout} sats</div>
                            </div>
                            
                            <p style="margin: 15px 0 0 0; color: #888; font-size: 0.9rem;">
                                ${data.message}
                            </p>
                        </div>
                    `;

                    document.getElementById('claim-ticket-number').value = '';
                    document.getElementById('claim-signature').value = '';
                    document.getElementById('claim-lightning-address').value = '';
                }
            } catch (error) {
                console.error('Claim failed:', error);
                statusDiv.innerHTML = `
                    <div style="background: rgba(239, 68, 68, 0.2); border: 1px solid var(--no-red); 
                                border-radius: 8px; padding: 15px;">
                        <strong>❌ Error:</strong> Failed to process claim
                    </div>
                `;
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert('Copied to clipboard!');
        }

        function closeBetModal() {
            document.getElementById('bet-modal').style.display = 'none';
            if (checkInterval) clearInterval(checkInterval);
        }

        // Cleanup countdowns when page unloads
        window.addEventListener('beforeunload', () => {
            Object.values(countdownIntervals).forEach(interval => clearInterval(interval));
        });

        loadMarkets();
        setInterval(loadMarkets, 30000);
    </script>
</body>
</html>
