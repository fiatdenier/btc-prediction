<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
<script>
    const API_BASE = 'https://predict.fiatdenier.com';

    // User ID from localStorage or generate new
    function getUserID() {
        let userId = localStorage.getItem('user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('user_id', userId);
        }
        return userId;
    }

    let marketData = null;
    let currentPositionId = null;
    let currentTicketData = null;
    let checkInterval = null;

    // Load market data
    async function loadMarket() {
        try {
            const response = await fetch(`${API_BASE}/market`);
            marketData = await response.json();

            displayMarket();
            updatePrices();

            // Show trading if market is open
            if (marketData.status === 'open') {
                document.getElementById('trading-section').style.display = 'block';
            } else {
                document.getElementById('trading-section').style.display = 'none';
            }

            await loadLeaderboard();
        } catch (error) {
            console.error('Failed to load market:', error);
        }
    }

    function displayMarket() {
        const statusClass = `status-${marketData.status}`;
        const deadline = new Date(marketData.deadline).toLocaleString();

        let outcomeText = '';
        if (marketData.status === 'resolved') {
            outcomeText = `<div style="margin-top: 20px; font-size: 1.2rem;">
                Outcome: <strong style="color: ${marketData.outcome === 'YES' ? 'var(--yes-green)' : 'var(--no-red)'}">
                ${marketData.outcome}</strong>
            </div>`;
        }

        document.getElementById('market-container').innerHTML = `
            <div class="question-text">${marketData.question}</div>
            <div class="market-status ${statusClass}">${marketData.status}</div>
            <div class="deadline">Deadline: ${deadline}</div>
            <div style="margin-top: 20px; color: #888;">
                Total Pool: <strong style="color: var(--btc-orange);">${marketData.total_pool.toLocaleString()} sats</strong>
            </div>
            ${outcomeText}
        `;
    }

    function updatePrices() {
        document.getElementById('yes-probability').textContent =
            marketData.yes_probability.toFixed(1) + '%';
        document.getElementById('no-probability').textContent =
            marketData.no_probability.toFixed(1) + '%';

        document.getElementById('yes-pool').textContent =
            marketData.yes_pool.toLocaleString() + ' sats';
        document.getElementById('no-pool').textContent =
            marketData.no_pool.toLocaleString() + ' sats';

        document.getElementById('yes-price').textContent =
            marketData.yes_price.toFixed(4);
        document.getElementById('no-price').textContent =
            marketData.no_price.toFixed(4);

        // Update share estimates
        updateShareEstimate('yes');
        updateShareEstimate('no');
    }

    function setAmount(side, amount) {
        document.getElementById(`${side}-amount`).value = amount;
        updateShareEstimate(side);
    }

    function updateShareEstimate(side) {
        const amount = parseInt(document.getElementById(`${side}-amount`).value) || 0;
        const price = marketData[`${side}_price`];
        const shares = amount > 0 ? (amount / price).toFixed(2) : 0;
        document.getElementById(`${side}-shares-amount`).textContent = shares;
    }

    // Listen for amount changes
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('yes-amount').addEventListener('input', () => updateShareEstimate('yes'));
        document.getElementById('no-amount').addEventListener('input', () => updateShareEstimate('no'));
    });

    async function placeBet(side) {
        const amount = parseInt(document.getElementById(`${side.toLowerCase()}-amount`).value);

        if (!amount || amount < 10) {
            alert('Minimum bet is 10 sats');
            return;
        }

        if (marketData.status !== 'open') {
            alert('Market is not open for betting');
            return;
        }

        try {
            // Disable button
            const btn = document.getElementById(`${side.toLowerCase()}-btn`);
            btn.classList.add('btn-disabled');
            btn.textContent = 'CREATING...';

            const response = await fetch(`${API_BASE}/create-position`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: getUserID(),
                    side: side,
                    amount: amount
                })
            });

            const data = await response.json();

            if (data.error) {
                alert(data.error);
                btn.classList.remove('btn-disabled');
                btn.textContent = `BUY ${side}`;
                return;
            }

            // Show invoice modal
            currentPositionId = data.position_id;
            showInvoiceModal(data);

        } catch (error) {
            console.error('Error placing bet:', error);
            alert('Failed to create position');
            const btn = document.getElementById(`${side.toLowerCase()}-btn`);
            btn.classList.remove('btn-disabled');
            btn.textContent = `BUY ${side}`;
        }
    }

    function showInvoiceModal(data) {
        const modal = document.getElementById('invoice-modal');
        const content = document.getElementById('modal-content-area');

        // Save ticket data with signature to localStorage
        currentTicketData = {
            ticket_number: data.ticket_number || data.position_id,
            signature: data.signature,
            side: data.side,
            amount: data.amount,
            shares: data.shares,
            timestamp: data.timestamp
        };

        const myTickets = JSON.parse(localStorage.getItem('my_tickets') || '[]');
        myTickets.push(currentTicketData);
        localStorage.setItem('my_tickets', JSON.stringify(myTickets));

        content.innerHTML = `
            <div class="success-message">
                Position created! Pay the invoice to confirm.
            </div>
            
            <div style="text-align: center; margin: 20px 0;">
                <div><strong>Side:</strong> ${data.side}</div>
                <div><strong>Amount:</strong> ${data.amount} sats</div>
                <div><strong>Shares:</strong> ${data.shares}</div>
                <div><strong>Price:</strong> ${data.price}</div>
            </div>

            <div id="qr-code" class="qr-placeholder"></div>

            <div class="invoice-box" id="invoice-text">${data.invoice}</div>

            <button class="action-btn" style="background: var(--btc-orange); margin-top: 20px;"
                    onclick="copyInvoice()">
                📋 COPY INVOICE
            </button>

            <div style="text-align: center; margin-top: 20px; color: #888; font-size: 0.9rem;">
                Checking for payment...
            </div>
        `;

        // Generate QR code
        const qrContainer = document.getElementById('qr-code');
        qrContainer.innerHTML = '';

        new QRCode(qrContainer, {
            text: data.invoice,
            width: 250,
            height: 250,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        modal.style.display = 'block';

        // Start checking for payment
        startPaymentCheck(data.position_id || data.ticket_number);
    }

    function copyInvoice() {
        const invoice = document.getElementById('invoice-text').textContent;
        navigator.clipboard.writeText(invoice);
        alert('Invoice copied to clipboard!');
    }

    function startPaymentCheck(positionId) {
        if (checkInterval) clearInterval(checkInterval);

        checkInterval = setInterval(async () => {
            try {
                const response = await fetch(`${API_BASE}/confirm-position/${positionId}`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.status === 'confirmed') {
                    clearInterval(checkInterval);

                    document.getElementById('modal-content-area').innerHTML = `
                        <div class="success-message">
                            <h2 style="margin: 0;">✅ PAYMENT CONFIRMED!</h2>
                            <p style="margin: 10px 0 0 0;">Your ticket has been activated.</p>
                        </div>
                        
                        <!-- Ticket Display -->
                        <div style="background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%); 
                                    border: 2px solid var(--btc-orange); 
                                    border-radius: 12px; 
                                    padding: 25px; 
                                    margin: 20px 0;
                                    text-align: center;">
                            
                            <div style="font-size: 0.9rem; color: #888; margin-bottom: 10px;">YOUR TICKET NUMBER</div>
                            <div style="font-size: 2.5rem; font-weight: bold; color: var(--btc-orange); 
                                        margin-bottom: 15px; font-family: 'Courier New', monospace; 
                                        letter-spacing: 3px;">
                                ${positionId}
                            </div>
                            
                            <div style="font-size: 0.8rem; color: #888; margin-top: 20px; padding-top: 15px; border-top: 1px solid #404040;">
                                CLAIM KEY (Keep Secret!)
                            </div>
                            <div style="font-family: 'Courier New', monospace; font-size: 0.7rem; 
                                        color: #666; word-break: break-all; margin-top: 10px; 
                                        background: #000; padding: 10px; border-radius: 6px; max-height: 80px; overflow-y: auto;">
                                ${currentTicketData.signature}
                            </div>
                            
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; 
                                        margin-top: 20px; padding-top: 15px; border-top: 1px solid #404040; 
                                        text-align: left;">
                                <div>
                                    <div style="color: #888; font-size: 0.8rem;">SIDE</div>
                                    <div style="font-size: 1.2rem; font-weight: bold; 
                                                color: ${data.position.side === 'YES' ? 'var(--yes-green)' : 'var(--no-red)'};">
                                        ${data.position.side}
                                    </div>
                                </div>
                                <div>
                                    <div style="color: #888; font-size: 0.8rem;">SHARES</div>
                                    <div style="font-size: 1.2rem; font-weight: bold;">${data.position.shares}</div>
                                </div>
                            </div>
                        </div>

                        <div style="background: rgba(255, 165, 0, 0.1); border: 1px solid var(--btc-orange); 
                                    border-radius: 8px; padding: 15px; margin: 15px 0;">
                            <strong>⚠️ SAVE YOUR TICKET INFO!</strong>
                            <p style="margin: 10px 0 0 0; font-size: 0.9rem;">
                                You need BOTH the ticket number AND claim key to collect winnings. 
                                The claim key proves you own this ticket. <strong>Keep it secret!</strong>
                            </p>
                        </div>

                        <button class="action-btn" style="background: var(--btc-orange); margin-top: 15px;"
                                onclick="copyTicketDetails('${positionId}', '${currentTicketData.signature}')">
                            📋 COPY FULL TICKET INFO
                        </button>

                        <button class="action-btn" style="background: var(--yes-green); margin-top: 10px;"
                                onclick="closeModal(); loadMarket();">
                            ✓ DONE
                        </button>
                    `;
                }
            } catch (error) {
                console.error('Payment check failed:', error);
            }
        }, 2000);
    }

    function copyTicketDetails(ticketNumber, signature) {
        const fullTicket = `🎫 PREDICTION MARKET TICKET
━━━━━━━━━━━━━━━━━━━━━━
TICKET NUMBER: ${ticketNumber}

CLAIM KEY (keep secret):
${signature}
━━━━━━━━━━━━━━━━━━━━━━
Save both to claim winnings!`;
        
        navigator.clipboard.writeText(fullTicket);
        alert('✅ Full ticket info copied!\n\nThis includes your ticket number AND claim key.\nKeep this safe - you need both to claim winnings!');
    }

    function closeModal() {
        document.getElementById('invoice-modal').style.display = 'none';
        if (checkInterval) clearInterval(checkInterval);

        // Re-enable buttons
        document.getElementById('yes-btn').classList.remove('btn-disabled');
        document.getElementById('yes-btn').textContent = 'BUY YES';
        document.getElementById('no-btn').classList.remove('btn-disabled');
        document.getElementById('no-btn').textContent = 'BUY NO';
    }

    async function loadLeaderboard() {
        try {
            const response = await fetch(`${API_BASE}/leaderboard`);
            const data = await response.json();

            if (data.length > 0) {
                const leaderboardHTML = data.map((entry, index) => `
                    <div class="leaderboard-row">
                        <div class="rank">#${index + 1}</div>
                        <div class="user-id">${entry.ticket || entry.user || 'Unknown'}</div>
                        <div style="color: ${entry.side === 'YES' ? 'var(--yes-green)' : 'var(--no-red)'};">
                            ${entry.amount} ${entry.side}
                        </div>
                        <div style="color: #888; font-size: 0.85rem;">${entry.shares} shares</div>
                    </div>
                `).join('');

                document.getElementById('leaderboard-list').innerHTML = leaderboardHTML;
            } else {
                document.getElementById('leaderboard-list').innerHTML =
                    '<div style="text-align: center; color: #888;">No positions yet</div>';
            }
        } catch (error) {
            console.error('Failed to load leaderboard:', error);
            document.getElementById('leaderboard-list').innerHTML =
                '<div style="text-align: center; color: #888;">Failed to load</div>';
        }
    }

    // Load market on page load
    loadMarket();

    // Refresh every 10 seconds
    setInterval(loadMarket, 10000);
</script>
